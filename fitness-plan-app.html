.plan-feature.dim{color:var(--muted)}
.plan-cta{width:100%;padding:14px;border-radius:var(--r);border:none;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.plan-cta-primary{background:linear-gradient(135deg,var(--steel),var(--steel2));color:var(--white);box-shadow:0 4px 20px rgba(58,95,150,.3)}
.plan-cta-primary:hover{box-shadow:0 6px 30px rgba(58,95,150,.5);transform:translateY(-1px)}
.plan-cta-secondary{background:transparent;border:1px solid var(--border2);color:var(--silver)}
.plan-cta-secondary:hover{border-color:var(--steel2);color:var(--white)}
.plan-cta-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.compare-table{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:40px}
.ct-head-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;background:var(--card2);padding:14px 16px;border-bottom:1px solid var(--border)}
.ct-head-cell{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--silver);text-align:center}
.ct-head-cell:first-child{text-align:left}
.ct-head-cell.featured-col{color:var(--steel3)}
.ct-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center}
.ct-row:last-child{border-bottom:none}
.ct-row:hover{background:rgba(255,255,255,.02)}
.ct-cell{font-size:12px;color:var(--silver);text-align:center}
.ct-cell:first-child{text-align:left;color:var(--white);font-weight:500}
.ct-cell.tick{color:var(--green);font-size:16px;font-weight:700}
.ct-cell.cross{color:var(--muted)}

function g(id){return document.getElementById(id);}
function tog(arr,v){var i=arr.indexOf(v);if(i===-1)arr.push(v);else arr.splice(i,1);}
function bind(id,fn){var e=g(id);if(e)e.onclick=fn;}
function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function noticeHtml(id){
  return '<div class="notice error" id="'+id+'" role="alert" aria-live="polite"></div>';
}
function showNotice(id,msg,type){
  var el=g(id);
  if(!el)return;
  el.className='notice show '+(type||'error');
  el.innerHTML=esc(msg);
  el.scrollIntoView({behavior:'smooth',block:'center'});
}
function clearNotice(id){
  var el=g(id);
  if(el){el.className='notice';el.innerHTML='';}
  document.querySelectorAll('.invalid').forEach(function(x){x.classList.remove('invalid');});
}
function markInvalid(id){
  var el=g(id);
  if(el)el.classList.add('invalid');
}

function applySmartPreset(key){
  var preset=SMART_PRESETS.find(function(p){return p.k===key;});
  if(!preset)return;
  Object.keys(preset).forEach(function(k){
    if(['k','title','tag','copy'].indexOf(k)!==-1)return;
    form[k]=Array.isArray(preset[k])?preset[k].slice():preset[k];
  });
  if(!form.equipment.length)form.equipment=['Full gym'];
}

function getAdj(){
  if(form.goal==='lose'){var d={mild_loss:-250,moderate_loss:-500,aggressive_loss:-750};return d[form.deficitLevel]||-500;}
  if(form.goal==='gain'){var s={lean_gain:200,moderate_gain:400,fast_gain:600};return s[form.surplusLevel]||300;}
  return 0;
}

function doCalc(){
  var w=parseFloat(form.weight),h=parseFloat(form.height),a=parseInt(form.age);
  var bmr=form.sex==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
  var tdee=Math.round(bmr*ACT[form.activity||'moderate']+parseInt(form.steps)*0.02);
  var target=Math.max(1200,tdee+getAdj());
  var protein=Math.round(w*2),fat=Math.round(target*0.25/9);
  var carbs=Math.round((target-protein*4-fat*9)/4);
  return{bmr:Math.round(bmr),tdee:tdee,target:target,protein:protein,fat:fat,carbs:carbs,adj:getAdj()};
}

function mbar(p,c,f){
  var tot=p*4+c*4+f*9||1,pp=Math.round(p*4/tot*100),cp=Math.round(c*4/tot*100),fp=100-pp-cp;
  return '<div class="mbar-labels"><span style="color:#3d5a85">Protein '+pp+'%</span><span style="color:#6ee7b7">Carbs '+cp+'%</span><span style="color:var(--ink3)">Fat '+fp+'%</span></div>'
    +'<div class="mbar-track"><div class="mbar-seg" style="width:'+pp+'%;background:var(--steel2)"></div><div class="mbar-seg" style="width:'+cp+'%;background:#6ee7b7"></div><div class="mbar-seg" style="width:'+fp+'%;background:var(--border2)"></div></div>';
}

function renderChips(list,field){
  var h='<div class="chips">';
  for(var i=0;i<list.length;i++){
    var v=typeof list[i]==='object'?(list[i].label||list[i].l||list[i].k):list[i];
    var k=typeof list[i]==='object'?list[i].k:list[i];
    var icon=typeof list[i]==='object'?(list[i].icon||''):'';
    var arr=form[field]||[];
    var sel=arr.indexOf(k)!==-1?' sel':'';
    h+='<div class="chip'+sel+'" id="chip-'+field+'-'+i+'">'
      +(icon?'<span style="margin-right:5px;font-size:14px">'+icon+'</span>':'')
      +v+'</div>';
  }
  return h+'</div>';
}
function bindChips(list,field){
  for(var i=0;i<list.length;i++){
    (function(idx){
      var k=typeof list[idx]==='object'?list[idx].k:list[idx];
      var el=g('chip-'+field+'-'+idx);
      if(el)el.onclick=function(){tog(form[field],k);render();};
    })(i);
  }
}

function goStep(s){if(s===4||s===5)calc=doCalc();step=s;render();window.scrollTo(0,0);}

function getStoredApiKey(){try{return localStorage.getItem('rb_api_key')||'';}catch(e){return'';}}
function getApiBaseUrl(){try{return (localStorage.getItem('rb_api_base_url')||'').replace(/\/$/,'');}catch(e){return'';}}
function promptForApiKey(){
  return new Promise(function(resolve){
    var existing=g('modal-overlay');if(existing)existing.parentNode.removeChild(existing);
    var overlay=document.createElement('div');overlay.className='modal-overlay';overlay.id='modal-overlay';
    overlay.innerHTML='<div class="modal"><div class="modal-hd"><div><div class="modal-title">Connect plan generation</div><div style="font-size:11px;color:var(--muted);margin-top:2px">Enter your Anthropic API key for this device.</div></div><button class="modal-close" id="api-key-cancel">&times;</button></div>'
      +'<div class="modal-body">'
      +'<div class="field"><label>Anthropic API key</label><input type="password" id="api-key-input" autocomplete="off" placeholder="sk-ant-..."><div class="field-hint">Stored locally in this app only. It is sent only to the local ReBourne server when generating plans, recipes or swaps.</div></div>'
      +'<button class="log-btn" id="api-key-save">Save key and continue</button>'
      +'<button class="swap-btn" id="api-key-skip">Cancel</button>'
      +'</div></div>';
    document.body.appendChild(overlay);
    var input=g('api-key-input'),save=g('api-key-save'),skip=g('api-key-skip'),cancel=g('api-key-cancel');
    function finish(value){
      if(overlay&&overlay.parentNode)overlay.parentNode.removeChild(overlay);
      resolve(value||'');
    }
    if(input)setTimeout(function(){input.focus();},50);
    if(save)save.onclick=function(){
      var key=(input&&input.value.trim())||'';
      if(!key){if(input)input.focus();return;}
      try{localStorage.setItem('rb_api_key',key);}catch(e){}
      finish(key);
    };
    if(input)input.onkeydown=function(e){if(e.key==='Enter'&&save)save.click();};
    if(skip)skip.onclick=function(){finish('');};
    if(cancel)cancel.onclick=function(){finish('');};
    overlay.onclick=function(e){if(e.target===overlay)finish('');};
  });
}
function promptForApiBaseUrl(){
  return new Promise(function(resolve){
    var existing=g('modal-overlay');if(existing)existing.parentNode.removeChild(existing);
    var overlay=document.createElement('div');overlay.className='modal-overlay';overlay.id='modal-overlay';
    overlay.innerHTML='<div class="modal"><div class="modal-hd"><div><div class="modal-title">Connect ReBourne server</div><div style="font-size:11px;color:var(--muted);margin-top:2px">Mobile builds need your hosted backend URL.</div></div><button class="modal-close" id="api-base-cancel">&times;</button></div>'
      +'<div class="modal-body">'
      +'<div class="field"><label>Backend URL</label><input type="url" id="api-base-input" autocomplete="off" placeholder="https://api.rebourne.co.uk"><div class="field-hint">This is where the app sends plan-generation requests. For production, this backend stores your model API key securely.</div></div>'
      +'<button class="log-btn" id="api-base-save">Save server and continue</button>'
      +'<button class="swap-btn" id="api-base-skip">Cancel</button>'
      +'</div></div>';
    document.body.appendChild(overlay);
    var input=g('api-base-input'),save=g('api-base-save'),skip=g('api-base-skip'),cancel=g('api-base-cancel');
    function finish(value){if(overlay&&overlay.parentNode)overlay.parentNode.removeChild(overlay);resolve(value||'');}
    if(input){input.value=getApiBaseUrl();setTimeout(function(){input.focus();},50);}
    if(save)save.onclick=function(){
      var url=(input&&input.value.trim().replace(/\/$/,''))||'';
      if(!url){if(input)input.focus();return;}
      try{localStorage.setItem('rb_api_base_url',url);}catch(e){}
      finish(url);
    };
    if(input)input.onkeydown=function(e){if(e.key==='Enter'&&save)save.click();};
    if(skip)skip.onclick=function(){finish('');};
    if(cancel)cancel.onclick=function(){finish('');};
    overlay.onclick=function(e){if(e.target===overlay)finish('');};
  });
}
async function apiMessage(payload){
  var headers={'Content-Type':'application/json'};
  var key=getStoredApiKey();
  if(key)headers['x-client-api-key']=key;
  var apiBase=getApiBaseUrl();
  var endpoint=(apiBase||'')+'/api/message';
  if(!apiBase&&location.protocol==='capacitor:'){
    apiBase=await promptForApiBaseUrl();
    endpoint=(apiBase||'')+'/api/message';
    if(!apiBase)throw new Error('A hosted ReBourne backend is needed for mobile plan generation.');
  }
  var res=await fetch(endpoint,{method:'POST',headers:headers,body:JSON.stringify(payload)});
  if(!res.ok){
    var err=await res.clone().json().catch(function(){return{};});
    var msg=(err.error&&err.error.message)||'';
    if(msg.indexOf('ANTHROPIC_API_KEY')>=0){
      key=await promptForApiKey();
      if(key){
        headers['x-client-api-key']=key;
        res=await fetch(endpoint,{method:'POST',headers:headers,body:JSON.stringify(payload)});
      }
    }
  }
  return res;
}

  var c=calc;
  var gl=form.goal==='lose'?'Fat loss':form.goal==='gain'?'Muscle gain':'Maintain/Recomp';
  var adj=getAdj();
  var adjStr=adj===0?'maintenance':adj>0?'+'+adj+' kcal surplus':Math.abs(adj)+' kcal deficit';
  var dietLabel=(DIETS.find(function(d){return d.k===form.dietType;})||{l:'Standard'}).l;
  var cardioStr=form.cardioTypes.length?form.cardioTypes.join(', '):'None';
  var equipStr=form.equipment.length?form.equipment.join(', '):'Not specified';
  var progressNote=overrideNote?overrideNote:(totalWeeks>1?'This is week '+weekNum+' of '+totalWeeks+'. '+(weekNum===1?'Start with foundational volume and technique.':weekNum===totalWeeks?'Peak week — maximum intensity and challenge.':'Progress from week '+(weekNum-1)+', increase load or volume by 5-10%.'):'');

  // Build plan-type specific context
  var planContext='';
  if(form.planType==='beginner')planContext='This is a BEGINNER programme. Focus on fundamental movement patterns: squat, hinge, push, pull. Keep exercise selection simple and prioritise form. Include full body or upper/lower splits. No advanced techniques.';
  else if(form.planType==='intermediate')planContext='This is an INTERMEDIATE programme. Include compound lifts with progressive overload, some isolation work. Push/pull/legs or upper/lower splits are appropriate. Include periodisation.';
  else if(form.planType==='advanced')planContext='This is an ADVANCED programme. High volume, intensity techniques (supersets, drop sets), complex movement patterns, advanced periodisation. Assume excellent lifting form and experience.';
  else if(form.planType==='hyrox')planContext='This is a HYROX RACE PREP programme. Combine functional fitness movements (ski erg, sled push/pull, burpee broad jumps, wall balls, sandbag lunges, rowing, farmers carry, running) with zone 2 and threshold running. Structure sessions as race simulations where appropriate.'+(form.raceDate?' Race date: '+form.raceDate+'.':'');
  else if(form.planType==='running')planContext='This is a RUNNING SPECIFIC programme. Structure training as: easy runs (zone 2), tempo runs, interval sessions, and one long run per week. Include strength work to support running performance. Distance goal: '+(form.distanceGoal||'general fitness')+'. Runs per week: '+form.runningDays+'.';
  else if(form.planType==='hybrid')planContext='This is a HYBRID ATHLETE programme. Balance heavy compound strength work with endurance training. Combine gym sessions with cardio sessions. Neither strength nor cardio should suffer — programme them intelligently to avoid interference.';
  else if(form.planType==='booty')planContext='This is a BOOTY BUILDER programme. Prioritise glute hypertrophy: hip thrusts, Romanian deadlifts, Bulgarian split squats, cable kickbacks, abductions, step-ups. Include progressive overload on all glute movements. Support with upper body and core work.';

  var prompt='Elite fitness coach. Generate a 7-day plan. Return ONLY valid JSON.\n'
    +'PROGRAMME TYPE: '+planLabel()+'\n'
    +'CLIENT: '+form.name+', Goal: '+gl+' ('+adjStr+'), Calories: '+c.target+' kcal/day\n'
    +'Macros: '+c.protein+'g protein, '+c.carbs+'g carbs, '+c.fat+'g fat\n'
    +'Diet: '+dietLabel+', Meals: '+form.meals+' main + '+form.snacks+' snacks\n'
    +'Allergies/Intolerances: '+(form.allergies||'None')+'\n'
    +'Dislikes: '+(form.dislikes||'None')+'\n'
    +'Training days/week: '+form.trainingDays+', Steps/day: '+form.steps+'\n'
    +'Equipment: '+equipStr+'\n'
    +'Cardio available: '+cardioStr+'\n'
    +'Injuries/Limitations: '+(form.injuries||'None')+'\n'
    +'Additional notes: '+(form.notes||'None')+'\n\n'
    +'PROGRAMME CONTEXT: '+planContext+'\n'
    +(progressNote?'WEEK PROGRESSION: '+progressNote+'\n':'')+'\n'
    +'JSON format: {"mealPlan":[{"day":"Monday","meals":[{"type":"Breakfast","name":"...","calories":0,"protein":0,"carbs":0,"fat":0}]}],"trainingPlan":[{"day":"Monday","type":"Push","focus":"...","exercises":["Bench press 4x8 RPE8"]}],"coachNotes":"..."}. '
    +'All 7 days. Train '+form.trainingDays+' days, rest others. Respect injuries. Follow diet. Snacks as meal entries.';

  var res=await apiMessage({model:'claude-haiku-4-5-20251001',max_tokens:4000,messages:[{role:'user',content:prompt}]});
  if(!res.ok){var e=await res.json().catch(function(){return{};});throw new Error((e.error&&e.error.message)||'API error '+res.status);}
  var data=await res.json().catch(function(){return{};});
  if(data.error&&data.error.message)throw new Error(data.error.message);
  if(data.stop_reason==='max_tokens')throw new Error('Response cut off on week '+weekNum+'. Please try again.');
  var text='';
  var blocks=Array.isArray(data.content)?data.content:[];
  for(var bi=0;bi<blocks.length;bi++){if(blocks[bi].type==='text'){text=blocks[bi].text;break;}}
  var s=text.indexOf('{'),e2=text.lastIndexOf('}');
  if(s===-1||e2<=s)throw new Error('Unexpected response on week '+weekNum+'. Please try again.');
  try{
    return JSON.parse(text.slice(s,e2+1));
  }catch(parseErr){
    throw new Error('The plan response was not valid JSON on week '+weekNum+'. Please try again.');
  }
}

async function startGenerate(){
  step=5;loading=true;apiErr=null;allWeeks=[];generatingWeek=0;
  // Load all cached data from localStorage
  loadAllLogs();
  render();
  try{
    // Generate all weeks in parallel - massive speed improvement
    var weekPromises = [];
    for(var w=1;w<=form.planWeeks;w++){
      weekPromises.push(generateWeek(w, form.planWeeks));
    }
    // Update loading message while waiting
    generatingWeek = form.planWeeks; render();
    var results = await Promise.all(weekPromises);
    allWeeks = results;
  }catch(err){apiErr=err.message;}
  loading=false;
  if(allWeeks.length>0) saveClientToCoach();
  render();
}

function syncClientData(){
  try{
    var clients=[];
    var stored=localStorage.getItem('rb_coach_clients');
    if(stored) clients=JSON.parse(stored);
    var idx=clients.findIndex(function(c){return c.name===form.name;});
    if(idx>-1){
      clients[idx].checkins=dash.checkins;
      clients[idx].adherence=dash.adherence;
      clients[idx].measurements=dash.measurements;
      localStorage.setItem('rb_coach_clients',JSON.stringify(clients));
    }
  }catch(e){}
}

function saveClientToCoach(){
  try{
    var clients=[];
    var stored=localStorage.getItem('rb_coach_clients');
    if(stored) clients=JSON.parse(stored);
    var record={
      name:form.name,
      email:form.email||'',
      planType:planLabel2(),
      planWeeks:form.planWeeks,
      goal:form.goal==='lose'?'Fat loss':form.goal==='gain'?'Muscle gain':'Maintain',
      dietType:form.dietType,
      trainingDays:form.trainingDays,
      steps:form.steps,
      injuries:form.injuries,
      allergies:form.allergies,
      dislikes:form.dislikes,
      calc:calc,
      checkins:dash.checkins,
      adherence:dash.adherence,
      measurements:dash.measurements,
      generatedAt:new Date().toISOString(),
      weekCount:allWeeks.length
    };
    // Update existing or add new
    var idx=clients.findIndex(function(c){return c.name===form.name&&c.planType===record.planType;});
    if(idx>-1) clients[idx]=record; else clients.unshift(record);
    // Cap at 200 clients
    if(clients.length>200) clients=clients.slice(0,200);
    localStorage.setItem('rb_coach_clients',JSON.stringify(clients));
  }catch(e){}
}

function calcSleepHours(bed,wake){
  if(!bed||!wake) return 0;
  var bp=bed.split(':'),wp=wake.split(':');
  var bm=parseInt(bp[0])*60+parseInt(bp[1]),wm=parseInt(wp[0])*60+parseInt(wp[1]);
  if(wm<=bm) wm+=1440;
  return Math.round((wm-bm)/60*10)/10;
}

// ── LINE CHART ────────────────────────────────────────────────────────────────
function renderLineChart(data,valKey,labelKey,unit,stroke,dotFill){
  if(!data||data.length<2) return '<div style="text-align:center;padding:24px;color:var(--muted);font-size:12px">Log more data to see trend</div>';
  var w=320,h=90,pl=36,pr=10,pt=10,pb=22;
  var vals=data.map(function(d){return d[valKey]||0;});
  var minV=Math.min.apply(null,vals),maxV=Math.max.apply(null,vals),range=maxV-minV||1;
  function px(i){return pl+i/(data.length-1)*(w-pl-pr);}
  function py(v){return pt+(1-(v-minV)/range)*(h-pt-pb);}
  var pts=data.map(function(d,i){return px(i)+','+py(d[valKey]);}).join(' ');
  var svg='<svg width="100%" viewBox="0 0 '+w+' '+h+'" aria-label="Progress chart">';
  [0,0.5,1].forEach(function(f){
    var y=pt+f*(h-pt-pb);
    svg+='<line x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'" stroke="rgba(255,255,255,.04)" stroke-width="1"/>';
    svg+='<text x="'+(pl-4)+'" y="'+(y+4)+'" font-size="9" fill="rgba(255,255,255,.3)" text-anchor="end" font-family="inherit">'+Math.round(maxV-f*range)+'</text>';
  });
  svg+='<polyline fill="none" stroke="'+stroke+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="'+pts+'"/>';
  data.forEach(function(d,i){
    svg+='<circle cx="'+px(i)+'" cy="'+py(d[valKey])+'" r="3.5" fill="'+dotFill+'" stroke="#05080F" stroke-width="2"/>';
    svg+='<text x="'+px(i)+'" y="'+(h-4)+'" font-size="8" fill="rgba(255,255,255,.3)" text-anchor="middle" font-family="inherit">'+d[labelKey]+'</text>';
  });
  svg+='</svg>';
  return svg;
}

// ── BAR CHART ─────────────────────────────────────────────────────────────────
function renderBarChart(data,valKey,labelKey,color){
  if(!data||!data.some(function(d){return d[valKey]>0;})) return '<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px">No data logged yet</div>';
  var w=320,h=80,pl=30,pr=8,pt=8,pb=18;
  var vals=data.map(function(d){return d[valKey]||0;});
  var maxV=Math.max.apply(null,vals)||1;
  var bw=(w-pl-pr)/data.length-3;
  var svg='<svg width="100%" viewBox="0 0 '+w+' '+h+'" aria-label="Bar chart">';
  data.forEach(function(d,i){
    var x=pl+i*(w-pl-pr)/data.length+1.5;
    var bh=((d[valKey]||0)/maxV)*(h-pt-pb);
    var y=h-pb-bh;
    if(bh>0) svg+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="2" fill="'+color+'" opacity="0.85"/>';
    if(d[valKey]) svg+='<text x="'+(x+bw/2)+'" y="'+(y-3)+'" font-size="8" fill="rgba(255,255,255,.5)" text-anchor="middle" font-family="inherit">'+Math.round(d[valKey])+'</text>';
    svg+='<text x="'+(x+bw/2)+'" y="'+(h-3)+'" font-size="8" fill="rgba(255,255,255,.3)" text-anchor="middle" font-family="inherit">'+d[labelKey]+'</text>';
  });
  svg+='</svg>';
  return svg;
}

// ── PIE / DONUT CHART ─────────────────────────────────────────────────────────
function renderDonut(segments,cx,cy,r,thick){
  var total=segments.reduce(function(s,sg){return s+(sg.val||0);},0)||1;
  var svg='',angle=-Math.PI/2;
  segments.forEach(function(sg){
    var sweep=2*Math.PI*(sg.val||0)/total;
    if(sweep<0.001) return;
    var x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    var x2=cx+r*Math.cos(angle+sweep),y2=cy+r*Math.sin(angle+sweep);
    var large=sweep>Math.PI?1:0;
    svg+='<path d="M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z" fill="'+sg.color+'" opacity="0.85"/>';
    angle+=sweep;
  });
  // Centre hole
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-thick)+'" fill="#05080F"/>';
  return svg;
}

function parseIngredients(mealName,store){
  var words=mealName.toLowerCase();
  INGREDIENT_MAP.forEach(function(item){
    if(words.indexOf(item.kw)!==-1){
      if(!store[item.name]) store[item.name]={name:item.name,cat:item.cat,totalGrams:0,totalMl:0,totalCount:0,occurrences:0};
      store[item.name].occurrences++;
      store[item.name].totalGrams+=(item.grams||0);
      store[item.name].totalMl+=(item.ml||0);
      store[item.name].totalCount+=(item.count||0);
    }
  });
  if(!store['Seasoning & herbs']) store['Seasoning & herbs']={name:'Seasoning & herbs',cat:'Pantry',totalGrams:0,totalMl:0,totalCount:0,occurrences:1};
  if(!store['Cooking oil']) store['Cooking oil']={name:'Cooking oil',cat:'Pantry',totalGrams:0,totalMl:0,totalCount:0,occurrences:1};
}

function groupIngredients(store){
  var cats={};
  Object.values(store).forEach(function(item){
    if(!cats[item.cat]) cats[item.cat]=[];
    var qty='As needed';
    if(item.totalGrams>0) qty=item.totalGrams+'g';
    else if(item.totalMl>0) qty=item.totalMl+'ml';
    else if(item.totalCount>0) qty=Math.ceil(item.totalCount)+' unit'+(item.totalCount>1?'s':'');
    cats[item.cat].push({name:item.name,qty:qty});
  });
  return cats;
}

// ── COACHING INSIGHTS ─────────────────────────────────────────────────────────
function generateInsights(){
  var insights=[];
  // Streak
  var streak=0;
  for(var i=allWeeks.length*7-1;i>=0;i--){
    var wi=Math.floor(i/7),di=i%7;
    var wk2=allWeeks[wi];if(!wk2)break;
    var tp=(wk2.trainingPlan||[])[di];
    if(!tp||!tp.exercises||!tp.exercises.length) continue;
    if(dash.adherence['train-w'+wi+'d'+di]) streak++;
    else break;
  }
  if(streak>=3) insights.push({type:'green',icon:'🔥',title:streak+'-session streak!',body:'Consistency is the single biggest driver of results. Keep going.'});
  // High stress
  var stressVals=Object.values(dash.morningLogs).map(function(m){return m.stress||0;}).filter(Boolean);
  if(stressVals.length>=4){
    var avgS=stressVals.reduce(function(a,b){return a+b;},0)/stressVals.length;
    if(avgS>=3.8) insights.push({type:'red',icon:'⚠️',title:'High stress detected',body:'Chronic stress elevates cortisol which competes directly with fat loss and muscle building. Consider a deload week.'});
  }
  // Weight plateau
  var wVals=Object.keys(dash.measurements).sort().map(function(k){return parseFloat(dash.measurements[k].weight||0);}).filter(Boolean);
  if(wVals.length>=3){
    var last3=wVals.slice(-3),range=Math.max.apply(null,last3)-Math.min.apply(null,last3);
    if(range<0.5&&form.goal!=='maintain') insights.push({type:'gold',icon:'⚠️',title:'Weight plateau detected',body:'Your weight has barely moved in 3 weeks. Consider a 2-day refeed at maintenance, or adjust your calorie target slightly.'});
  }
  // Sleep insight
  var sleepH=Object.values(dash.sleepLogs).map(function(s){return s.hours||0;}).filter(Boolean);
  if(sleepH.length>=3){
    var avgH=sleepH.reduce(function(a,b){return a+b;},0)/sleepH.length;
    if(avgH<6.5) insights.push({type:'purple',icon:'💤',title:'Sleep needs attention',body:'You are averaging '+Math.round(avgH*10)/10+'h per night. Aim for 7-9h. Sleep is your most powerful recovery tool.'});
    else if(avgH>=7.5) insights.push({type:'green',icon:'✨',title:'Great sleep profile',body:'Averaging '+Math.round(avgH*10)/10+'h — your recovery is well supported.'});
  }
  if(!insights.length) insights.push({type:'steel',icon:'📊',title:'Keep logging to unlock insights',body:'Log your check-ins, workouts and meals for 5+ days to see personalised coaching insights.'});
  return insights;
}

function getWeeklyCoachReview(weekIndex){
  var wk=allWeeks[weekIndex]||{};
  var plannedSessions=0,doneSessions=0,plannedMeals=0,eatenMeals=0,plannedCals=0,loggedCals=0;
  (wk.trainingPlan||[]).forEach(function(day,di){
    if(day.exercises&&day.exercises.length){
      plannedSessions++;
      if(dash.adherence['train-w'+weekIndex+'d'+di])doneSessions++;
    }
  });
  (wk.mealPlan||[]).forEach(function(day,di){
    var log=dash.nutritionLogs['w'+weekIndex+'d'+di]||{eaten:{}};
    (day.meals||[]).forEach(function(meal,mi){
      plannedMeals++;
      plannedCals+=meal.calories||0;
      if(log.eaten&&log.eaten[mi]){
        eatenMeals++;
        loggedCals+=meal.calories||0;
      }
    });
  });
  var adherence=plannedSessions?Math.round(doneSessions/plannedSessions*100):0;
  var mealAdherence=plannedMeals?Math.round(eatenMeals/plannedMeals*100):0;
  var calAdherence=plannedCals?Math.round(loggedCals/plannedCals*100):0;
  var meas=dash.measurements[weekIndex]||{};
  var prevMeas=dash.measurements[weekIndex-1]||{};
  var weight=parseFloat(meas.weight||0)||0;
  var prevWeight=parseFloat(prevMeas.weight||0)||0;
  var weightDelta=(weight&&prevWeight)?Math.round((weight-prevWeight)*10)/10:null;
  var sleepVals=[],energyVals=[],stressVals=[],volume=0,sets=0,bestSet=0,runPaces=[];
  for(var di2=0;di2<7;di2++){
    var dayKey2='w'+weekIndex+'d'+di2;
    var sl=dash.sleepLogs[dayKey2];
    if(sl&&sl.hours)sleepVals.push(parseFloat(sl.hours));
    var ml=dash.morningLogs[dayKey2];
    if(ml&&ml.energy)energyVals.push(parseFloat(ml.energy));
    if(ml&&ml.stress)stressVals.push(parseFloat(ml.stress));
    (dash.cardioLogs[dayKey2]||[]).forEach(function(log){
      if((log.type||'').toLowerCase().indexOf('running')>=0&&log.distance&&log.duration){
        runPaces.push(parseFloat(log.duration)/parseFloat(log.distance));
      }
    });
  }
  Object.keys(dash.workoutLogs).forEach(function(k){
    if(k.indexOf('w'+weekIndex+'d')!==0)return;
    (dash.workoutLogs[k]||[]).forEach(function(set){
      var wt=parseFloat(set.weight||0)||0,reps=parseFloat(set.reps||0)||0;
      if(wt||reps)sets++;
      if(wt&&reps)volume+=wt*reps;
      if(wt>bestSet)bestSet=wt;
    });
  });
  function avg(vals){return vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;}
  var avgSleep=avg(sleepVals),avgEnergy=avg(energyVals),avgStress=avg(stressVals);
  var bestPace=runPaces.length?Math.min.apply(null,runPaces):null;
  var ci=dash.checkins[weekIndex]||{};
  var readinessParts=[];
  readinessParts.push(adherence);
  readinessParts.push(mealAdherence||50);
  readinessParts.push(avgSleep?Math.min(100,Math.round(avgSleep/8*100)):60);
  readinessParts.push(avgEnergy?Math.round(avgEnergy/5*100):60);
  readinessParts.push(avgStress?Math.max(20,Math.round((6-avgStress)/5*100)):60);
  if(ci.energy)readinessParts.push(Math.round(ci.energy/5*100));
  if(ci.sleep)readinessParts.push(Math.round(ci.sleep/5*100));
  var readiness=Math.round(readinessParts.reduce(function(a,b){return a+b;},0)/readinessParts.length);
  var actions=[];
  if(adherence>=80)actions.push({level:'high',title:'Progress training load',body:'Adherence is strong. Next similar strength sessions should aim for a small lift: add 1 rep per set or 2.5kg where form stays clean.'});
  else if(plannedSessions)actions.push({level:'medium',title:'Protect consistency first',body:'Training adherence is '+adherence+'%. Keep the same plan structure next week and prioritise completing the planned sessions before increasing volume.'});
  if(mealAdherence>=80&&form.goal==='lose'&&weightDelta!==null&&weightDelta>-0.2)actions.push({level:'medium',title:'Tighten the calorie target',body:'Food logging is solid but weight has not moved much. Consider reducing the daily target by 100-150 kcal or adding 1,500-2,000 steps.'});
  else if(mealAdherence>=80&&form.goal==='gain'&&weightDelta!==null&&weightDelta<0.2)actions.push({level:'medium',title:'Increase fuel slightly',body:'Logging is consistent but weight gain is slow. Add 150-200 kcal per day, preferably around training.'});
  else if(mealAdherence<60)actions.push({level:'medium',title:'Improve nutrition signal',body:'Only '+mealAdherence+'% of planned meals are marked eaten. Aim for at least 80% logging so future calorie changes are based on useful data.'});
  if(avgSleep&&avgSleep<6.5)actions.push({level:'low',title:'Prioritise recovery',body:'Average sleep is '+Math.round(avgSleep*10)/10+'h. Hold training intensity steady and move one hard session away from the poorest sleep night.'});
  if(avgStress&&avgStress>=4)actions.push({level:'low',title:'Watch recovery pressure',body:'Stress is trending high. Keep the plan, but use lower RPE targets and extra warm-up work this week.'});
  if(weightDelta===null)actions.push({level:'low',title:'Log weekly weight',body:'Add this week and last week weight measurements to unlock calorie adjustment advice.'});
  if(sets>0)actions.push({level:'high',title:'Track overload from logged sets',body:'You have '+sets+' logged sets this week. Use the strongest clean set as the target to beat next time.'});
  if(!actions.length)actions.push({level:'low',title:'Build the first data loop',body:'Complete a few workouts, mark meals eaten, and add sleep or weight data. ReBourne will turn that into a weekly adjustment.'});
  return {readiness:readiness,adherence:adherence,mealAdherence:mealAdherence,calAdherence:calAdherence,weightDelta:weightDelta,avgSleep:avgSleep,avgEnergy:avgEnergy,avgStress:avgStress,volume:volume,sets:sets,bestSet:bestSet,bestPace:bestPace,actions:actions.slice(0,4)};
}

function getCalorieAdjustment(review){
  if(!review||review.weightDelta===null||review.mealAdherence<80)return {delta:0,title:'',body:''};
  if(form.goal==='lose'){
    if(review.weightDelta>-0.2)return {delta:-150,title:'Adaptive calorie adjustment',body:'Food logging is consistent, but weight loss has stalled. Reduce the daily target slightly and reassess next week.'};
    if(review.weightDelta<-1)return {delta:100,title:'Adaptive calorie adjustment',body:'Weight is dropping quickly. Add a small amount back to protect training performance and recovery.'};
  }
  if(form.goal==='gain'){
    if(review.weightDelta<0.2)return {delta:150,title:'Adaptive calorie adjustment',body:'Logging is consistent, but gain is slow. Add calories around training to support muscle growth.'};
    if(review.weightDelta>0.7)return {delta:-100,title:'Adaptive calorie adjustment',body:'Weight is rising quickly. Pull calories back slightly to keep the gain leaner.'};
  }
  if(form.goal==='maintain'&&Math.abs(review.weightDelta)>0.5){
    return {delta:review.weightDelta>0?-100:100,title:'Adaptive calorie adjustment',body:'Weight is drifting away from maintenance. Use a small calorie correction and review again next week.'};
  }
  return {delta:0,title:'',body:''};
}

function getTrainingType(day){
  var wk=allWeeks[dash.week]||{};
  var d=(wk.trainingPlan||[]).find(function(x){return x.day===day;});
  return d?d.type:'';
}

function cleanExerciseName(ex){
  return (ex||'')
    .split('\u2014')[0]
    .split('\u2013')[0]
    .split('(')[0]
    .replace(/\b\d+\s*x\s*\d+\b/ig,'')
    .replace(/\bRPE\s*\d+\b/ig,'')
    .replace(/[^a-z0-9 ]/ig,' ')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}

function parseRepTarget(ex){
  var txt=ex||'';
  var range=txt.match(/x\s*(\d+)\s*[-–]\s*(\d+)/i);
  if(range)return parseInt(range[2]);
  var single=txt.match(/x\s*(\d+)/i);
  if(single)return parseInt(single[1]);
  return 8;
}

function parseWorkoutKey(key){
  var m=key.match(/w(\d+)d(\d+)ex(\d+)/);
  return m?{week:parseInt(m[1]),day:parseInt(m[2]),exercise:parseInt(m[3]),order:parseInt(m[1])*7+parseInt(m[2])}:null;
}

function setScore(set){
  var wt=parseFloat(set.weight||0)||0,reps=parseFloat(set.reps||0)||0;
  if(!wt&&!reps)return 0;
  return wt*(1+(reps/30));
}

function bestSetFromLogs(logs){
  var best=null;
  (logs||[]).forEach(function(set){
    var wt=parseFloat(set.weight||0)||0,reps=parseFloat(set.reps||0)||0;
    if(!wt&&!reps)return;
    var candidate={weight:wt,reps:reps,score:setScore(set)};
    if(!best||candidate.score>best.score)best=candidate;
  });
  return best;
}

function getExerciseHistory(ex,currentKey){
  var name=cleanExerciseName(ex);
  var current=parseWorkoutKey(currentKey)||{order:9999};
  var history=[];
  Object.keys(dash.workoutLogs).forEach(function(key){
    var parsed=parseWorkoutKey(key);
    if(!parsed||parsed.order>current.order||key===currentKey)return;
    var logs=dash.workoutLogs[key]||[];
    var loggedName=cleanExerciseName((logs[0]&&logs[0].exercise)||'');
    if(!loggedName||loggedName!==name)return;
    var best=bestSetFromLogs(logs);
    if(best)history.push({key:key,week:parsed.week,day:parsed.day,order:parsed.order,best:best,logs:logs});
  });
  history.sort(function(a,b){return a.order-b.order;});
  return history;
}

function getProgressiveTarget(ex,currentKey){
  var history=getExerciseHistory(ex,currentKey);
  var repTarget=parseRepTarget(ex);
  var last=history.length?history[history.length-1]:null;
  var best=null;
  history.forEach(function(h){if(!best||h.best.score>best.score)best=h.best;});
  if(!last){
    return {status:'empty',last:null,best:null,historyCount:0,target:'Log a baseline today',note:'Record clean working sets. ReBourne will use these to suggest the next progression.'};
  }
  var lastBest=last.best;
  var suggestedWeight=lastBest.weight;
  var suggestedReps=lastBest.reps;
  var status='progress';
  var target='';
  var note='';
  if(lastBest.weight&&lastBest.reps>=repTarget){
    suggestedWeight=Math.round((lastBest.weight+2.5)*2)/2;
    suggestedReps=Math.max(1,repTarget-1);
    target='Aim for '+suggestedWeight+'kg x '+suggestedReps+'-'+repTarget;
    note='You hit the top end last time, so the next clean step is a small load increase.';
  }else if(lastBest.weight){
    suggestedReps=lastBest.reps+1;
    target='Repeat '+lastBest.weight+'kg and aim for '+suggestedReps+' reps';
    note='Build reps before adding load. Move up once you can hit '+repTarget+' clean reps.';
  }else{
    target='Beat last session by 1 clean rep';
    note='No load was logged, so progression is based on reps for now.';
  }
  if(history.length>=2){
    var prev=history[history.length-2].best;
    var flat=Math.abs(lastBest.score-prev.score)<1;
    if(flat){
      status='hold';
      note='Progress has been flat across the last two logs. Keep the target controlled and focus on form, tempo and full range.';
    }
  }
  return {status:status,last:lastBest,best:best,historyCount:history.length,target:target,note:note};
}

function renderOverloadPanel(ex,currentKey){
  var o=getProgressiveTarget(ex,currentKey);
  if(o.status==='empty'){
    return '<div class="overload-panel empty"><div class="overload-top"><div class="overload-title">Progressive overload</div><div class="overload-badge">Baseline</div></div><div class="overload-target"><strong>'+o.target+'</strong></div><div class="overload-note">'+o.note+'</div></div>';
  }
  var lastTxt=o.last.weight?o.last.weight+'kg x '+o.last.reps:o.last.reps+' reps';
  var bestTxt=o.best&&o.best.weight?o.best.weight+'kg x '+o.best.reps:'--';
  var trendTxt=o.historyCount+' log'+(o.historyCount===1?'':'s');
  var badge=o.status==='hold'?'Hold':'Progress';
  var html='<div class="overload-panel"><div class="overload-top"><div class="overload-title">Progressive overload</div><div class="overload-badge '+o.status+'">'+badge+'</div></div>';
  html+='<div class="overload-grid">';
  html+='<div class="overload-stat"><div class="overload-stat-val">'+lastTxt+'</div><div class="overload-stat-lbl">Last best set</div></div>';
  html+='<div class="overload-stat"><div class="overload-stat-val">'+bestTxt+'</div><div class="overload-stat-lbl">Exercise PB</div></div>';
  html+='<div class="overload-stat"><div class="overload-stat-val">'+trendTxt+'</div><div class="overload-stat-lbl">History</div></div>';
  html+='</div><div class="overload-target"><strong>Today:</strong> '+o.target+'</div><div class="overload-note">'+o.note+'</div></div>';
  return html;
}

      return{weight:wEl?wEl.value:'',reps:rEl?rEl.value:'',exercise:ex};
    });

  saveAllLogs();

  html+='</div><span class="session-type-badge" style="background:rgba(58,95,150,.25);color:var(--steel3)">'+(dayData.type||'Session')+'</span></div>';
  html+='<div class="ex-list">';
  (dayData.exercises||[]).forEach(function(ex,ei){
    var exKey='w'+dash.week+'d'+dash.day+'ex'+ei;
    var logs=dash.workoutLogs[exKey]||[{weight:'',reps:''}];
    var exName=ex.split('\u2014')[0].split('\u2013')[0].split('(')[0].trim();
    var ytUrl='https://www.youtube.com/results?search_query='+encodeURIComponent(exName+' exercise tutorial');
    html+='<div class="ex-row"><span class="ex-num">'+(ei+1)+'</span>';
    html+='<div style="flex:1"><div style="font-size:12px;color:var(--white);font-weight:500;margin-bottom:3px">'+ex+'</div>';
    html+='<a href="'+ytUrl+'" target="_blank" rel="noopener" style="font-size:10px;color:var(--steel2);text-decoration:none">&#9654; Watch tutorial</a>';
    html+=renderOverloadPanel(ex,exKey);
    html+='<div class="ex-log-wrap"><div class="ex-log-title">Log your sets</div>';
    logs.forEach(function(set,si){
      html+='<div class="set-row"><span class="set-num">Set '+(si+1)+'</span>';
      html+='<input class="log-input weight" type="number" step="0.5" placeholder="kg" value="'+(set.weight||'')+'" id="w-'+exKey+'-'+si+'">';
      html+='<span class="log-input-lbl">kg</span>';
      html+='<input class="log-input reps" type="number" placeholder="reps" value="'+(set.reps||'')+'" id="r-'+exKey+'-'+si+'">';
      html+='<span class="log-input-lbl">reps</span></div>';
    });
    html+='<button class="add-set-btn" id="addset-'+exKey+'">+ Add set</button>';
    html+='</div></div></div>';
  });
  html+='</div>';
  var done=dash.adherence['train-w'+dash.week+'d'+dash.day];
  html+='<div style="display:flex;gap:8px;padding:14px 16px">';
  html+='<button class="pri-btn" id="save-workout" style="flex:1">Save workout</button>';
  html+='<button class="check-item'+(done?' done':'')+'" id="train-done-btn" style="flex:1;border-radius:var(--r);justify-content:center;padding:12px;cursor:pointer;background:transparent;border:1px solid var(--border)">';
  html+='<div class="check-box">'+(done?'&#10003;':'')+'</div><span class="check-label" style="margin-left:8px">'+(done?'Complete!':'Mark complete')+'</span></button>';
  html+='</div></div>';
  return html;
}

// SHOPPING TAB
// ══════════════════════════════════════════════════════════════════════════
function renderShoppingTab(){
  var html='';
  html+='<div class="shop-toggle"><button class="shop-t-btn'+(dash.shopMode==='daily'?' active':'')+'" id="shop-daily">Today</button>';
  html+='<button class="shop-t-btn'+(dash.shopMode==='weekly'?' active':'')+'" id="shop-weekly">This week</button></div>';
  if(dash.shopMode==='weekly'){
    html+='<div class="week-nav">';
    allWeeks.forEach(function(w,i){html+='<button class="week-btn'+(dash.week===i?' active':'')+'" id="swk-'+i+'">Week '+(i+1)+'</button>';});
    html+='</div>';
  } else {
    html+='<div class="day-nav">';
    DAYS.forEach(function(d,i){html+='<button class="day-btn'+(dash.day===i?' active':'')+'" id="sday-'+i+'">'+d.slice(0,3)+'</button>';});
    html+='</div>';
  }
  var store={};
  var wk=allWeeks[dash.week]||{};
  if(dash.shopMode==='weekly'){
    (wk.mealPlan||[]).forEach(function(day){(day.meals||[]).forEach(function(meal){parseIngredients(meal.name,store);});});
  } else {
    var dd=(wk.mealPlan||[])[dash.day]||{meals:[]};
    (dd.meals||[]).forEach(function(meal){parseIngredients(meal.name,store);});
  }
  var cats=groupIngredients(store);
  Object.keys(cats).forEach(function(cat){
    html+='<div class="shop-category"><div class="shop-cat-title">'+cat+'</div>';
    cats[cat].forEach(function(item,ii){
      var k=cat+'-'+ii+'-'+(dash.shopMode==='weekly'?'w'+dash.week:'d'+dash.day);
      var checked=dash.checkedShop[k];
      html+='<div class="shop-item" id="sitem-'+k+'">';
      html+='<div class="shop-check'+(checked?' checked':'')+'" id="schk-'+k+'">'+(checked?'&#10003;':'')+'</div>';
      html+='<span style="'+(checked?'text-decoration:line-through;color:var(--muted)':'')+'">'+item.name+'</span>';
      html+='<span class="shop-qty">'+item.qty+'</span></div>';
    });
    html+='</div>';
  });
  if(!Object.keys(cats).length) html+='<p style="color:var(--muted);font-size:13px;text-align:center;padding:24px">No data available for this selection.</p>';
  return html;
}

// PROGRESS TAB
// ══════════════════════════════════════════════════════════════════════════
function renderProgressTab(){
  var html='';
  var totalSessions=0,doneSessions=0;
  allWeeks.forEach(function(wk,wi){
    (wk.trainingPlan||[]).forEach(function(day,di){
      if(day.exercises&&day.exercises.length){totalSessions++;if(dash.adherence['train-w'+wi+'d'+di])doneSessions++;}
    });
  });
  var adhPct=totalSessions?Math.round(doneSessions/totalSessions*100):0;
  var loggedSets=0,bestWeight=0;
  Object.keys(dash.workoutLogs).forEach(function(k){
    (dash.workoutLogs[k]||[]).forEach(function(set){
      if(set.weight||set.reps)loggedSets++;
      bestWeight=Math.max(bestWeight,parseFloat(set.weight||0)||0);
    });
  });
  var runCount=0,bestPace=null;
  Object.keys(dash.cardioLogs).forEach(function(k){
    (dash.cardioLogs[k]||[]).forEach(function(log){
      if((log.type||'').toLowerCase().indexOf('running')>=0&&log.distance&&log.duration){
        runCount++;
        var pace=parseFloat(log.duration)/parseFloat(log.distance);
        if(!bestPace||pace<bestPace)bestPace=pace;
      }
    });
  });
  var paceTxt=bestPace?Math.floor(bestPace)+':'+String(Math.round((bestPace%1)*60)).padStart(2,'0'):'--';
  html+='<div class="progress-hero"><div class="progress-hero-title">Progress</div><div class="progress-hero-sub">Training, nutrition and performance trends in one place.</div><div class="training-hero-tags"><span class="training-tag">'+doneSessions+' workouts complete</span><span class="training-tag">'+loggedSets+' sets logged</span><span class="training-tag">'+runCount+' runs tracked</span></div></div>';
  html+='<div class="performance-grid">';
  html+='<div class="performance-card"><div class="performance-val">'+adhPct+'%</div><div class="performance-lbl">Adherence</div><div class="performance-sub">'+doneSessions+' of '+totalSessions+' planned sessions complete.</div></div>';
  html+='<div class="performance-card"><div class="performance-val">'+(bestWeight?bestWeight+'kg':'--')+'</div><div class="performance-lbl">Strength peak</div><div class="performance-sub">Highest logged set weight. This will surface lift progress.</div></div>';
  html+='<div class="performance-card"><div class="performance-val">'+paceTxt+'</div><div class="performance-lbl">Best run pace</div><div class="performance-sub">'+(bestPace?'min/km from logged runs.':'Log running distance and time to track pace.')+'</div></div>';
  html+='<div class="performance-card"><div class="performance-val">'+loggedSets+'</div><div class="performance-lbl">Workout volume</div><div class="performance-sub">Logged strength sets across the programme.</div></div>';
  html+='</div>';
  html+=renderWeeklyCoachReview(dash.week);
  // Adherence
  html+='<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel3);margin-bottom:14px;display:flex;align-items:center;gap:9px">Training adherence<div style="flex:1;height:1px;background:var(--border)"></div></div>';
  allWeeks.forEach(function(wk,wi){
    var sessions=(wk.trainingPlan||[]).filter(function(d){return d.exercises&&d.exercises.length;}).length;
    var done=0;for(var di=0;di<7;di++){if(dash.adherence['train-w'+wi+'d'+di])done++;}
    var pct=sessions>0?Math.round(done/sessions*100):0;
    html+='<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">';
    html+='<span style="color:var(--silver)">Week '+(wi+1)+'</span><span style="font-weight:600;color:'+(pct>=70?'var(--green)':'var(--steel2)')+'">'+done+' / '+sessions+' &mdash; '+pct+'%</span></div>';
    html+='<div style="height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(pct>=70?'var(--green)':'var(--steel2)')+';border-radius:2px"></div></div></div>';
  });
  // Measurements
  html+='<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel3);margin:20px 0 14px;display:flex;align-items:center;gap:9px">Body measurements<div style="flex:1;height:1px;background:var(--border)"></div></div>';
  var meas=dash.measurements[dash.week]||{};
  var measFields=[{k:'weight',l:'Weight',u:'kg'},{k:'waist',l:'Waist',u:'cm'},{k:'chest',l:'Chest',u:'cm'},{k:'hips',l:'Hips',u:'cm'},{k:'thigh',l:'Thigh',u:'cm'},{k:'arm',l:'Arm',u:'cm'},{k:'bodyfat',l:'Body fat',u:'%'}];
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px">';
  measFields.forEach(function(mf){
    html+='<div><div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--silver);margin-bottom:5px">'+mf.l+' ('+mf.u+')</div>';
    html+='<input type="number" step="0.1" id="meas-'+mf.k+'" value="'+(meas[mf.k]||'')+'" placeholder="--" style="width:100%;padding:9px;border:1px solid var(--border2);border-radius:var(--r);background:rgba(13,21,37,.8);color:var(--white);font-family:inherit;font-size:13px;outline:none"></div>';
  });
  html+='</div>';
  html+='<button class="log-btn" id="save-meas" style="margin-bottom:20px">Save measurements for Week '+(dash.week+1)+'</button>';
  // Weight trend
  var wVals=Object.keys(dash.measurements).sort().filter(function(k){return dash.measurements[k].weight;});
  if(wVals.length>0){
    html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:14px">';
    html+='<div style="font-size:11px;font-weight:600;color:var(--white);margin-bottom:10px">Weight trend</div>';
    var startW=parseFloat(dash.measurements[wVals[0]].weight)||0;
    wVals.forEach(function(wi){
      var w=dash.measurements[wi];if(!w.weight)return;
      var diff=Math.round((parseFloat(w.weight)-startW)*10)/10;
      var col=form.goal==='lose'?(diff<=0?'var(--green)':'var(--red)'):form.goal==='gain'?(diff>=0?'var(--green)':'var(--steel2)'):'var(--steel2)';
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px">'
        +'<span style="color:var(--silver)">Week '+(parseInt(wi)+1)+'</span>'
        +'<span style="font-weight:700;color:var(--white)">'+w.weight+'kg</span>'
        +'<span style="font-size:11px;font-weight:600;color:'+col+'">'+(parseInt(wi)===0?'Start':(diff>0?'+':'')+diff+'kg')+'</span></div>';
    });
    html+='</div>';
  }
  // Week selector + check-in
  html+='<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel3);margin-bottom:14px;display:flex;align-items:center;gap:9px">Weekly check-in<div style="flex:1;height:1px;background:var(--border)"></div></div>';
  html+='<div class="week-nav">';
  allWeeks.forEach(function(w,i){html+='<button class="week-btn'+(dash.week===i?' active':'')+'" id="pwk-'+i+'">Week '+(i+1)+'</button>';});
  html+='</div>';
  var ci=dash.checkins[dash.week]||{};
  [{k:'energy',q:'Energy levels this week?'},{k:'hunger',q:'How manageable is your hunger?'},{k:'sleep',q:'Sleep quality this week?'}].forEach(function(q){
    html+='<div class="checkin-card"><div class="checkin-q">'+q.q+'</div><div class="rating-row">';
    for(var r=1;r<=5;r++) html+='<button class="rating-btn'+(ci[q.k]===r?' sel':'')+'" id="ci-'+q.k+'-'+r+'">'+r+'</button>';
    html+='</div></div>';
  });
  // Photos
  html+='<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel3);margin:20px 0 14px;display:flex;align-items:center;gap:9px">Progress photos<div style="flex:1;height:1px;background:var(--border)"></div></div>';
  html+='<div class="photo-grid">';
  allWeeks.forEach(function(wk,wi){
    var photo=dash.photoLogs[wi];
    html+='<div class="photo-cell" id="photo-cell-'+wi+'"><input type="file" accept="image/*" class="photo-upload-input" id="photo-input-'+wi+'">';
    if(photo) html+='<img src="'+photo+'" alt="Week '+(wi+1)+' photo">';
    else html+='<div class="photo-cell-empty"><i class="ti ti-camera" aria-hidden="true"></i><span>Week '+(wi+1)+'</span></div>';
    html+='<div class="photo-week-lbl">W'+(wi+1)+'</div></div>';
  });
  html+='</div>';
  var photoWks=Object.keys(dash.photoLogs).map(Number).sort();
  if(photoWks.length>=2){
    html+='<div class="photo-compare">';
    html+='<div class="photo-compare-cell"><img src="'+dash.photoLogs[photoWks[0]]+'" alt="Before"><div class="photo-compare-lbl">Week '+(photoWks[0]+1)+'</div></div>';
    html+='<div class="photo-compare-cell"><img src="'+dash.photoLogs[photoWks[photoWks.length-1]]+'" alt="After"><div class="photo-compare-lbl">Week '+(photoWks[photoWks.length-1]+1)+'</div></div>';
    html+='</div>';
  }
  return html;
}

// ══════════════════════════════════════════════════════════════════════════
// BIND DASHBOARD INTERACTIONS
// ══════════════════════════════════════════════════════════════════════════
function bindDashTab(){
  function bnd(id,fn){var e=g(id);if(e)e.onclick=fn;}

  // Overview
  if(dash.tab==='overview'){bnd('ov-dl',downloadPlan);bnd('ov-reset',resetAll);}

  // Today
  if(dash.tab==='today'){
    var key2=dayKey();
    bnd('today-add-meal',function(){showAddMealModal();});
    allWeeks.forEach(function(w,i){bnd('tdwk-'+i,function(){dash.week=i;dash.day=0;renderDashboard(g('app'));});});
    DAYS.forEach(function(d,i){bnd('tdday-'+i,function(){dash.day=i;renderDashboard(g('app'));});});
    var wk2=allWeeks[dash.week]||{},dm=(wk2.mealPlan||[])[dash.day]||{meals:[]};
    (dm.meals||[]).forEach(function(m,mi){
      bnd('eat-'+key2+'-'+mi,function(ev){
        if(ev&&ev.target&&ev.target.closest&&ev.target.closest('button'))return;
        if(!dash.nutritionLogs[key2])dash.nutritionLogs[key2]={eaten:{}};
        if(!dash.nutritionLogs[key2].eaten)dash.nutritionLogs[key2].eaten={};
        dash.nutritionLogs[key2].eaten[mi]=!dash.nutritionLogs[key2].eaten[mi];
        saveAllLogs();renderDashboard(g('app'));
      });
      var todayMealKey='w'+dash.week+'d'+dash.day+'m'+mi;
      bnd('today-recipe-'+todayMealKey,function(){openRecipeModal(m,todayMealKey);});
      (function(meal,k){bnd('today-swap-'+k,function(){
        if(dash.swapLoading&&dash.swapLoading[k])return;
        openSwapChoiceModal(meal,k);
      });})(m,todayMealKey);
    });
    bnd('water-add',function(){if(!dash.waterLogs[key2])dash.waterLogs[key2]=0;dash.waterLogs[key2]+=250;saveAllLogs();renderDashboard(g('app'));});
    bnd('water-500',function(){if(!dash.waterLogs[key2])dash.waterLogs[key2]=0;dash.waterLogs[key2]+=500;saveAllLogs();renderDashboard(g('app'));});
    bnd('water-undo',function(){if(!dash.waterLogs[key2])return;dash.waterLogs[key2]=Math.max(0,dash.waterLogs[key2]-250);saveAllLogs();renderDashboard(g('app'));});
    var wGoal2=waterGoal(),gl2=Math.min(Math.round(wGoal2/250),12);
    for(var gi=0;gi<gl2;gi++){(function(idx){bnd('wg-'+key2+'-'+idx,function(){dash.waterLogs[key2]=(idx+1)*250;saveAllLogs();renderDashboard(g('app'));});})(gi);}
    bnd('log-cardio-btn',function(){
      var t=g('cardio-type'),d2=g('cardio-duration'),dist=g('cardio-distance'),n=g('cardio-notes');
      var dur=parseInt(d2?d2.value:0)||0;if(!dur){alert('Please enter a duration.');return;}
      if(!dash.cardioLogs[key2])dash.cardioLogs[key2]=[];
      dash.cardioLogs[key2].push({type:t?t.value:'Running',duration:dur,distance:parseFloat(dist?dist.value:0)||0,notes:n?n.value:'',calories:cardioCalories(t?t.value:'Running',dur)});
      saveAllLogs();renderDashboard(g('app'));
    });
    (dash.cardioLogs[key2]||[]).forEach(function(log,li){bnd('rm-cardio-'+li,function(){dash.cardioLogs[key2].splice(li,1);saveAllLogs();renderDashboard(g('app'));});});
    bnd('save-steps',function(){if(!dash.measurements[dash.week])dash.measurements[dash.week]={};var sv=g('steps-input');if(sv)dash.measurements[dash.week].steps=sv.value;saveAllLogs();renderDashboard(g('app'));});
    bnd('save-sleep',function(){
      var bed=g('sleep-bed'),wake=g('sleep-wake'),qual=0;
      for(var qi=1;qi<=5;qi++){if(g('slq-'+qi)&&g('slq-'+qi).classList.contains('sel')){qual=qi;break;}}
      var hrs=calcSleepHours(bed?bed.value:'',wake?wake.value:'');
      dash.sleepLogs[key2]={bedtime:bed?bed.value:'',waketime:wake?wake.value:'',hours:hrs,quality:qual};
      saveAllLogs();var btn=g('save-sleep');if(btn){btn.textContent='Saved!';btn.style.background='var(--green)';btn.style.color='#000';}
      setTimeout(function(){renderDashboard(g('app'));},700);
    });
    for(var qi=1;qi<=5;qi++){(function(q){bnd('slq-'+q,function(){if(!dash.sleepLogs[key2])dash.sleepLogs[key2]={};dash.sleepLogs[key2].quality=q;saveAllLogs();renderDashboard(g('app'));});})(qi);}
    ['eng','sor','str'].forEach(function(prefix,pi){
      var slider=g(prefix+'-slider'),valEl=g(prefix+'-val');
      if(slider&&valEl)slider.oninput=function(){valEl.textContent=slider.value+'/5';};
    });
    ['sor','eng','str'].forEach(function(prefix,pi){
      var field=['soreness','energy','stress'][pi];
      for(var v=1;v<=5;v++){(function(val){bnd(prefix+'-'+val,function(){if(!dash.morningLogs[key2])dash.morningLogs[key2]={rhr:'',soreness:0,energy:0,stress:0,supplements:{}};dash.morningLogs[key2][field]=val;saveAllLogs();renderDashboard(g('app'));});})(v);}
    });
    bnd('save-morning',function(){
      if(!dash.morningLogs[key2])dash.morningLogs[key2]={rhr:'',soreness:0,energy:0,stress:0,supplements:{}};
      var rhrEl=g('rhr-input');if(rhrEl)dash.morningLogs[key2].rhr=rhrEl.value;
      var engSl=g('eng-slider'),sorSl=g('sor-slider'),strSl=g('str-slider');
      if(engSl)dash.morningLogs[key2].energy=parseInt(engSl.value)||0;
      if(sorSl)dash.morningLogs[key2].soreness=parseInt(sorSl.value)||0;
      if(strSl)dash.morningLogs[key2].stress=parseInt(strSl.value)||0;
      saveAllLogs();var btn=g('save-morning');if(btn){btn.textContent='Saved!';btn.style.background='var(--green)';btn.style.color='#000';}
      setTimeout(function(){renderDashboard(g('app'));},700);
    });
  }

  // Nutrition
  if(dash.tab==='nutrition'){
    var wkN=allWeeks[dash.week]||{},dayN=(wkN.mealPlan||[])[dash.day]||{meals:[]};
    bnd('nutrition-add-meal',function(){showAddMealModal();});
    allWeeks.forEach(function(w,i){bnd('nwk-'+i,function(){dash.week=i;dash.day=0;renderDashboard(g('app'));});});
    DAYS.forEach(function(d,i){bnd('nday-'+i,function(){dash.day=i;renderDashboard(g('app'));});});
    (dayN.meals||[]).forEach(function(m,mi){
      var key3='w'+dash.week+'d'+dash.day+'m'+mi;
      bnd('recipe-'+key3,function(){openRecipeModal(m,key3);});
      (function(meal,k){bnd('swap-'+k,function(){
        if(dash.swapLoading&&dash.swapLoading[k])return;
        openSwapChoiceModal(meal,k);
      });})(m,key3);
    });
  }

  // Training
  if(dash.tab==='training'){
    allWeeks.forEach(function(w,i){bnd('twk-'+i,function(){dash.week=i;dash.day=0;renderDashboard(g('app'));});});
    DAYS.forEach(function(d,i){bnd('tday-'+i,function(){dash.day=i;renderDashboard(g('app'));});});
    bnd('train-done-btn',function(){var k='train-w'+dash.week+'d'+dash.day;dash.adherence[k]=!dash.adherence[k];saveAllLogs();renderDashboard(g('app'));});
    bnd('save-workout',function(){saveWorkoutLogs();var btn=g('save-workout');if(btn){btn.textContent='Saved!';btn.style.background='var(--green)';btn.style.color='#000';}setTimeout(function(){renderDashboard(g('app'));},1000);});
    var wkT=allWeeks[dash.week]||{},tpT=(wkT.trainingPlan||[])[dash.day]||{};
    (tpT.exercises||[]).forEach(function(ex,ei){
      var exKey='w'+dash.week+'d'+dash.day+'ex'+ei;
      bnd('addset-'+exKey,function(){if(!dash.workoutLogs[exKey])dash.workoutLogs[exKey]=[{weight:'',reps:''}];dash.workoutLogs[exKey].push({weight:'',reps:'',exercise:ex});renderDashboard(g('app'));});
    });
  }

  // Shopping
  if(dash.tab==='shopping'){
    bnd('shop-daily',function(){dash.shopMode='daily';renderDashboard(g('app'));});
    bnd('shop-weekly',function(){dash.shopMode='weekly';renderDashboard(g('app'));});
    allWeeks.forEach(function(w,i){bnd('swk-'+i,function(){dash.week=i;renderDashboard(g('app'));});});
    DAYS.forEach(function(d,i){bnd('sday-'+i,function(){dash.day=i;renderDashboard(g('app'));});});

function recipeCacheKey(meal){return 'rb_recipe_'+meal.name.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+form.dietType;}
function loadRecipeFromStorage(meal){try{var k=recipeCacheKey(meal);if(dash.recipeCache[k])return dash.recipeCache[k];var stored=localStorage.getItem(k);if(stored){var p=JSON.parse(stored);dash.recipeCache[k]=p;return p;}}catch(e){}return null;}
function saveRecipeToStorage(meal,recipe){try{var k=recipeCacheKey(meal);dash.recipeCache[k]=recipe;localStorage.setItem(k,JSON.stringify(recipe));var allKeys=Object.keys(localStorage).filter(function(k2){return k2.indexOf('rb_recipe_')===0;});if(allKeys.length>50)localStorage.removeItem(allKeys[0]);}catch(e){}}
function openRecipeModal(meal,key){var cached=loadRecipeFromStorage(meal);if(cached){showRecipeModal(meal,cached,key);return;}showRecipeLoadingModal(meal,key);generateRecipe(meal,key);}

async function generateRecipe(meal,key){
  try{
    var prompt='Generate a recipe for: '+meal.name+'. Macros: '+meal.calories+' kcal, P:'+meal.protein+'g C:'+meal.carbs+'g F:'+meal.fat+'g. Diet: '+form.dietType+'. Allergies: '+(form.allergies||'None')+'. Return ONLY valid JSON: {"servings":1,"prepTime":"10 mins","cookTime":"20 mins","ingredients":[{"name":"...","amount":"...","category":"Protein"}],"method":["Step 1..."],"tips":"..."}';
    var res=await apiMessage({model:'claude-sonnet-4-20250514',max_tokens:1500,messages:[{role:'user',content:prompt}]});
    if(!res.ok)throw new Error('Recipe API error '+res.status);
    var data=await res.json();
    var blocks=Array.isArray(data.content)?data.content:[];
    var text=(blocks.find(function(b){return b.type==='text';})||{}).text||'';
    var s=text.indexOf('{'),e2=text.lastIndexOf('}');

function applyMealSwap(originalMeal,key,newMeal){
  var parts=key.match(/w(\d+)d(\d+)m(\d+)/);
  if(parts){
    var wi=parseInt(parts[1]),di=parseInt(parts[2]),mi=parseInt(parts[3]);
    if(allWeeks[wi]&&allWeeks[wi].mealPlan&&allWeeks[wi].mealPlan[di]){
      newMeal.type=originalMeal.type;
      allWeeks[wi].mealPlan[di].meals[mi]=newMeal;
      delete dash.recipeCache[recipeCacheKey(originalMeal)];
      saveAllLogs();
      return true;
    }
  }
  return false;
}

function applyManualMealAdd(key,newMeal){
  var parts=key.match(/add-w(\d+)d(\d+)/);
  if(!parts)return false;
  var wi=parseInt(parts[1]),di=parseInt(parts[2]);
  if(!allWeeks[wi])return false;
  if(!allWeeks[wi].mealPlan)allWeeks[wi].mealPlan=[];
  if(!allWeeks[wi].mealPlan[di])allWeeks[wi].mealPlan[di]={day:DAYS[di],meals:[]};
  if(!allWeeks[wi].mealPlan[di].meals)allWeeks[wi].mealPlan[di].meals=[];
  allWeeks[wi].mealPlan[di].meals.push(newMeal);
  var mi=allWeeks[wi].mealPlan[di].meals.length-1;
  var dKey='w'+wi+'d'+di;
  if(!dash.nutritionLogs[dKey])dash.nutritionLogs[dKey]={eaten:{}};
  if(!dash.nutritionLogs[dKey].eaten)dash.nutritionLogs[dKey].eaten={};
  dash.nutritionLogs[dKey].eaten[mi]=true;
  saveAllLogs();
  return true;
}

function manualMealFallback(name,desc,originalMeal){
  var txt=(name+' '+desc).toLowerCase(),base=originalMeal||{calories:520,protein:35,carbs:55,fat:18};
  var calories=base.calories||520,protein=base.protein||35,carbs=base.carbs||55,fat=base.fat||18;
  if(txt.indexOf('salad')>=0){calories-=120;carbs-=20;fat-=4;}
  if(txt.indexOf('pizza')>=0||txt.indexOf('burger')>=0){calories+=180;fat+=12;carbs+=18;}
  if(txt.indexOf('rice')>=0||txt.indexOf('pasta')>=0||txt.indexOf('wrap')>=0){carbs+=25;calories+=110;}
  if(txt.indexOf('chicken')>=0||txt.indexOf('turkey')>=0||txt.indexOf('tuna')>=0){protein+=18;calories+=80;}
  if(txt.indexOf('protein')>=0||txt.indexOf('whey')>=0){protein+=25;calories+=120;}
  if(txt.indexOf('oil')>=0||txt.indexOf('avocado')>=0||txt.indexOf('cheese')>=0){fat+=12;calories+=120;}
  return{calories:Math.max(150,Math.round(calories)),protein:Math.max(5,Math.round(protein)),carbs:Math.max(5,Math.round(carbs)),fat:Math.max(3,Math.round(fat))};
}
async function estimateManualMacros(originalMeal,key){
  var nameEl=g('manual-meal-name'),descEl=g('manual-meal-desc'),btn=g('manual-estimate');
  var name=(nameEl&&nameEl.value.trim())||'Manual meal',desc=(descEl&&descEl.value.trim())||'';
  if(btn){btn.disabled=true;btn.textContent='Estimating...';}
  var macros=null;
  try{
    var prompt='Estimate nutrition macros for this meal. Meal name: '+name+'. Details: '+desc+'. Return ONLY valid JSON: {"calories":0,"protein":0,"carbs":0,"fat":0}. Use grams for protein/carbs/fat.';
    var res=await apiMessage({model:'claude-haiku-4-5-20251001',max_tokens:160,messages:[{role:'user',content:prompt}]});
    if(res.ok){
      var data=await res.json(),blocks=Array.isArray(data.content)?data.content:[],text=(blocks.find(function(b){return b.type==='text';})||{}).text||'';
      var s=text.indexOf('{'),e=text.lastIndexOf('}');
      if(s>=0&&e>s)macros=JSON.parse(text.slice(s,e+1));
    }
  }catch(err){}
  if(!macros)macros=manualMealFallback(name,desc,originalMeal);
  [['manual-calories','calories'],['manual-protein','protein'],['manual-carbs','carbs'],['manual-fat','fat']].forEach(function(pair){var el=g(pair[0]);if(el)el.value=Math.round(parseFloat(macros[pair[1]]||0));});
  if(btn){btn.disabled=false;btn.textContent='Regenerate macros';}
}
async function saveManualMeal(originalMeal,key){
  var nameEl=g('manual-meal-name'),descEl=g('manual-meal-desc'),typeEl=g('manual-meal-type'),favEl=g('manual-save-fav');
  var name=(nameEl&&nameEl.value.trim())||'Manual meal';
  if(!g('manual-calories')||!g('manual-calories').value)await estimateManualMacros(originalMeal,key);

  if(key&&key.indexOf('add-')===0&&(!favEl||favEl.checked))rememberSavedMeal(newMeal);
  var ok=(key&&key.indexOf('add-')===0)?applyManualMealAdd(key,newMeal):applyMealSwap(originalMeal,key,newMeal);
  if(ok){closeModal();renderDashboard(g('app'));}
}

    if(!res.ok)throw new Error('Meal swap API error '+res.status);

  bnd2('plan-cta-free', function(){ step=-2; render(); window.scrollTo(0,0); });

if(initialParams.get('front')==='1'){
