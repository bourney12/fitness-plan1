<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReBourne — Reinvent Your Potential</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --midnight:#07101D;
  --midnight2:#0d1929;
  --midnight3:#132236;
  --steel:#3A5F96;
  --steel2:#7E98BC;
  --silver:#F5F5F5;
  --silver2:#b8c4d4;
  --charcoal:#0E1117;
  --white:#F5F5F5;
  --ink:#F5F5F5;
  --ink2:#D6D8DC;
  --ink3:#7E98BC;
  --card:#0d1929;
  --card2:#132236;
  --border:rgba(122,152,188,0.15);
  --border2:rgba(122,152,188,0.28);
  --accent:#3A5F96;
  --accent-light:#7E98BC;
  --gold:#c9a96e;
  --r:8px;--rl:12px;--rxl:16px;
}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--midnight);color:var(--ink);min-height:100vh;line-height:1.6}

/* ── TYPOGRAPHY ─────────────────────────────────────── */
h1,h2,h3{font-family:'Playfair Display',serif;font-weight:600}
.serif-italic{font-family:'Playfair Display',serif;font-style:italic;font-weight:400}

/* ── LAYOUT ─────────────────────────────────────────── */
.wrap{max-width:680px;margin:0 auto;padding:0 20px 80px}

/* ── HEADER ─────────────────────────────────────────── */
.site-header{background:var(--charcoal);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo-mark{display:flex;align-items:center;gap:12px}
.splash-wordmark{font-size:32px;letter-spacing:.32em;margin-bottom:12px;line-height:1}
.splash-re{font-weight:300;color:#7E98BC}
.splash-bourne{font-weight:700;color:#F5F5F5}
.splash-tagline-row{display:flex;align-items:center;gap:14px;margin-bottom:52px}
.splash-line{width:40px;height:1px;background:#3A5F96;flex-shrink:0}
.splash-tag{font-size:9px;font-weight:500;letter-spacing:.28em;color:#7E98BC;text-transform:uppercase;white-space:nowrap}
.splash-divider{width:1px;height:40px;background:linear-gradient(to bottom,#3A5F96,transparent);margin-bottom:40px}
.splash-headline{font-family:'Playfair Display',serif;font-size:22px;font-weight:400;font-style:italic;color:#F5F5F5;line-height:1.6;margin-bottom:40px;max-width:420px}
.splash-btn{background:transparent;border:1px solid #3A5F96;color:#F5F5F5;font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;padding:16px 48px;border-radius:2px;cursor:pointer;transition:all .3s;font-family:inherit;margin-bottom:16px}
.splash-sub{font-size:10px;font-weight:400;letter-spacing:.18em;color:#3A5F96;text-transform:uppercase;margin-top:12px}

/* ── LANDING ─────────────────────────────────────────── */
.hero{text-align:center;padding:64px 0 48px;position:relative}
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:1px;height:40px;background:linear-gradient(to bottom,transparent,var(--steel2))}
.hero-label{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--steel2);margin-bottom:16px;margin-top:48px}
.hero h1{font-size:42px;line-height:1.1;margin-bottom:8px;color:var(--white)}
.hero-tag{font-size:11px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--silver2);margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:12px}
.hero-tag::before,.hero-tag::after{content:'';flex:40px 0 0;height:1px;background:var(--steel)}
.hero-sub{font-size:15px;color:var(--ink3);line-height:1.8;max-width:480px;margin:0 auto 48px}

/* Feature pills */
.feat-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:48px}
.feat-pill{display:flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid var(--border2);border-radius:100px;font-size:12px;color:var(--silver);background:var(--card)}
.feat-pill-dot{width:6px;height:6px;border-radius:50%;background:var(--steel2);flex-shrink:0}

/* Plan type cards */
.section-label{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--steel2);margin-bottom:20px;display:flex;align-items:center;gap:12px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.plan-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px}
.pt-card{border:1px solid var(--border);border-radius:var(--rl);padding:20px 16px;cursor:pointer;background:var(--card);transition:all .2s;position:relative;overflow:hidden}
.pt-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--steel);opacity:0;transition:opacity .2s}
.pt-card:hover{border-color:var(--border2);background:var(--card2)}
.pt-card.sel{border-color:var(--steel2);background:var(--card2)}
.pt-card.sel::before{opacity:1}
.pt-card-icon{font-size:22px;margin-bottom:8px}
.pt-card-title{font-size:14px;font-weight:600;color:var(--white);margin-bottom:3px}
.pt-card-desc{font-size:11px;color:var(--ink3);line-height:1.5}
.pt-card-tag{display:inline-block;margin-top:8px;font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 8px;border-radius:100px;background:rgba(50,73,109,.4);color:var(--steel2)}

/* Duration cards */
.dur-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:32px}
.dur-card{border:1px solid var(--border);border-radius:var(--r);padding:16px 10px;cursor:pointer;text-align:center;background:var(--card);transition:all .2s;position:relative}
.dur-card.sel{border-color:var(--steel2);background:var(--card2)}
.dur-pop{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--steel);color:var(--white);font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 9px;border-radius:100px;white-space:nowrap;text-transform:uppercase}
.dur-num{font-family:'Playfair Display',serif;font-size:28px;color:var(--white);margin-bottom:2px}
.dur-label{font-size:11px;font-weight:500;color:var(--silver);margin-bottom:2px}
.dur-desc{font-size:10px;color:var(--ink3)}

/* CTA */
.cta-btn{width:100%;padding:16px;border-radius:var(--r);border:none;background:var(--steel);color:var(--white);font-family:'Montserrat',sans-serif;font-size:14px;font-weight:600;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;transition:all .2s;margin-top:8px}
.cta-btn:hover{background:var(--steel2)}
.cta-btn:disabled{opacity:.35;cursor:not-allowed}

/* ── PROGRESS ────────────────────────────────────────── */
.prog-wrap{padding:20px 0 4px}
.prog-track{height:2px;background:var(--border);border-radius:1px;overflow:hidden}
.prog-fill{height:100%;background:var(--steel2);border-radius:1px;transition:width .4s}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:8px;font-weight:500;letter-spacing:.04em}

/* ── FORM CARD ───────────────────────────────────────── */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:28px;margin:20px 0}
.form-card-title{font-size:22px;color:var(--white);margin-bottom:6px}
.form-card-sub{font-size:13px;color:var(--ink3);margin-bottom:24px;line-height:1.6}
.field{margin-bottom:1rem}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--silver2);margin-bottom:8px}
.field-hint{font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.5}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:12px 14px;
  border:1px solid var(--border2);border-radius:var(--r);
  font-family:'Montserrat',sans-serif;font-size:13px;
  color:var(--white);background:var(--midnight2);
  outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none
}
input:focus,select:focus,textarea:focus{border-color:var(--steel2);box-shadow:0 0 0 3px rgba(50,73,109,.25)}
textarea{min-height:88px;resize:vertical}
select option{background:var(--midnight)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* Activity selector */
.act-list{display:flex;flex-direction:column;gap:8px}
.act-opt{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;cursor:pointer;background:var(--midnight2);display:flex;align-items:flex-start;gap:12px;transition:all .15s}
.act-opt:hover{border-color:var(--border2)}
.act-opt.sel{border-color:var(--steel2);background:var(--card2)}
.act-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);margin-top:5px;flex-shrink:0;transition:background .15s}
.act-opt.sel .act-dot{background:var(--steel2)}
.act-title{font-size:13px;font-weight:600;color:var(--white)}
.act-desc{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.4}
.act-ex{font-size:11px;color:var(--steel2);margin-top:3px;font-style:italic}

/* Goal cards */
.goal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1rem}
.goal-card{border:1px solid var(--border);border-radius:var(--r);padding:14px 10px;cursor:pointer;text-align:center;background:var(--midnight2);transition:all .15s}
.goal-card:hover{border-color:var(--border2)}
.goal-card.sel{border-color:var(--steel2);background:var(--card2)}
.goal-icon{font-size:20px;margin-bottom:6px}
.goal-label{font-size:12px;font-weight:600;color:var(--white)}
.goal-desc{font-size:10px;color:var(--ink3);margin-top:2px}

/* Intensity */
.intensity-box{margin-top:14px;padding:16px;background:var(--midnight2);border-radius:var(--r);border:1px solid var(--border)}
.intensity-title{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--silver2);margin-bottom:12px}
.int-opts{display:flex;flex-direction:column;gap:7px}
.int-opt{border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;cursor:pointer;background:var(--card);display:flex;justify-content:space-between;align-items:center;transition:all .15s}
.int-opt:hover{border-color:var(--border2)}
.int-opt.sel{border-color:var(--steel2);background:var(--card2)}
.int-label{font-size:13px;font-weight:600;color:var(--white)}
.int-kcal{font-size:11px;color:var(--ink3);font-weight:400;margin-left:6px}
.int-detail{font-size:11px;color:var(--ink3);margin-top:2px}
.int-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:100px;flex-shrink:0;margin-left:10px}
.b-mild{background:rgba(16,185,129,.15);color:#6ee7b7}
.b-mod{background:rgba(245,158,11,.15);color:#fcd34d}
.b-agg{background:rgba(239,68,68,.15);color:#fca5a5}
.b-lean{background:rgba(59,130,246,.15);color:#93c5fd}
.b-fast{background:rgba(139,92,246,.15);color:#c4b5fd}

/* Diet cards */
.diet-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem}
.diet-card{border:1px solid var(--border);border-radius:var(--r);padding:12px 10px;cursor:pointer;text-align:center;background:var(--midnight2);transition:all .15s}
.diet-card:hover{border-color:var(--border2)}
.diet-card.sel{border-color:var(--steel2);background:var(--card2)}
.diet-label{font-size:12px;font-weight:600;color:var(--white)}
.diet-desc{font-size:10px;color:var(--ink3);margin-top:2px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:.75rem}
.chip{padding:7px 13px;border-radius:100px;border:1px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;background:var(--midnight2);color:var(--ink3);transition:all .15s;font-family:'Montserrat',sans-serif}
.chip:hover{border-color:var(--border2);color:var(--silver)}
.chip.sel{background:var(--steel);border-color:var(--steel2);color:var(--white)}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--silver2);margin:1.25rem 0 .75rem;display:flex;align-items:center;gap:10px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}

/* Slider */
.sl-wrap{position:relative;padding-top:24px;margin-bottom:.5rem}
.sl-val{position:absolute;right:0;top:0;font-size:13px;font-weight:600;color:var(--steel2)}
input[type=range]{padding:0;border:none;background:var(--border);height:3px;border-radius:2px;accent-color:var(--steel2);box-shadow:none;width:100%}

/* Plan-specific training cards */
.train-card{border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;background:var(--midnight2);transition:all .15s;margin-bottom:8px;display:flex;align-items:center;gap:14px}
.train-card:hover{border-color:var(--border2)}
.train-card.sel{border-color:var(--steel2);background:var(--card2)}
.train-icon{font-size:20px;flex-shrink:0}
.train-title{font-size:13px;font-weight:600;color:var(--white)}
.train-desc{font-size:11px;color:var(--ink3);margin-top:2px}

/* Cardio specific */
.cardio-sub{background:var(--midnight2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:12px}
.cardio-sub-title{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--silver2);margin-bottom:12px}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:1rem}
.stat{background:var(--midnight2);border-radius:var(--r);padding:14px;border:1px solid var(--border)}
.stat.hi{background:var(--steel);border-color:var(--steel2)}
.stat-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:4px}
.stat.hi .stat-lbl{color:rgba(255,255,255,.7)}
.stat-val{font-size:22px;font-weight:600;color:var(--white);font-family:'Playfair Display',serif}
.stat-unit{font-size:10px;color:var(--ink3);margin-top:2px}
.stat.hi .stat-unit{color:rgba(255,255,255,.65)}
.mbar-labels{display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:5px}
.mbar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;display:flex;margin-bottom:1rem}
.mbar-seg{height:100%}

/* Summary badges */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.bdg{font-size:11px;font-weight:600;padding:4px 11px;border-radius:100px;letter-spacing:.04em}
.bdg-steel{background:rgba(50,73,109,.5);color:var(--steel2);border:1px solid rgba(50,73,109,.4)}
.bdg-gold{background:rgba(201,169,110,.15);color:var(--gold);border:1px solid rgba(201,169,110,.25)}
.bdg-red{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}

/* Coach note */
.coach-note{border-left:2px solid var(--steel2);padding:14px 18px;background:var(--midnight2);border-radius:0 var(--r) var(--r) 0;font-size:14px;color:var(--ink2);line-height:1.8;margin-bottom:1.5rem;font-style:italic}

/* Plan output */
.week-header{background:var(--steel);border-radius:var(--r);padding:12px 18px;margin:20px 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--white)}
.day-block{border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px;overflow:hidden}
.day-hd{padding:10px 14px;background:var(--midnight2);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--silver)}
.day-body{padding:12px 14px}
.meal-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.meal-row:last-child{border-bottom:none}
.meal-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--steel2)}
.meal-name{font-size:13px;font-weight:500;color:var(--white);margin-top:2px}
.meal-macros{font-size:11px;color:var(--ink3);margin-top:2px}
.meal-cals{font-size:13px;font-weight:600;color:var(--white);flex-shrink:0;margin-left:12px}
.ex-item{padding:5px 0;display:flex;gap:9px;border-bottom:1px solid var(--border);font-size:12px;color:var(--ink2)}
.ex-item:last-child{border-bottom:none}
.ex-arr{color:var(--steel2);font-weight:700;flex-shrink:0}
.plan-title{font-size:15px;font-weight:600;color:var(--white);margin:1.25rem 0 .75rem;letter-spacing:.02em}

/* Buttons */
.btn-row{display:flex;gap:10px;margin-top:1.5rem}
.nav-btn{padding:12px 22px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;cursor:pointer;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:.04em;transition:all .15s}
.nav-btn:hover{color:var(--white);border-color:var(--silver2)}
.pri-btn{flex:1;background:var(--steel);border:none;border-radius:var(--r);padding:13px;font-size:13px;font-weight:700;color:var(--white);cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:.08em;text-transform:uppercase;transition:background .15s}
.pri-btn:hover{background:var(--steel2)}

/* Spinner */
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:3rem 0;color:var(--ink3);font-size:14px}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--steel2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:var(--r);padding:14px;font-size:13px;color:#fca5a5;margin-bottom:1rem}
.disclaimer{background:rgba(201,169,110,.08);border:1px solid rgba(201,169,110,.2);border-radius:var(--r);padding:12px 14px;font-size:11px;color:var(--gold);margin-bottom:1rem;line-height:1.6}

/* Download */
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:var(--r);border:1px solid var(--steel2);background:var(--steel);color:var(--white);font-size:13px;font-weight:700;cursor:pointer;margin-top:.875rem;font-family:'Montserrat',sans-serif;letter-spacing:.06em;text-transform:uppercase;transition:background .15s}
.dl-btn:hover{background:var(--steel2)}
.reset-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--ink3);font-size:12px;font-weight:600;cursor:pointer;margin-top:.5rem;font-family:'Montserrat',sans-serif;letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.reset-btn:hover{border-color:var(--border2);color:var(--silver)}

@media(max-width:500px){.plan-type-grid,.dur-grid,.row2,.row3,.goal-grid,.diet-grid,.stat-grid{grid-template-columns:1fr 1fr}.dur-grid{grid-template-columns:1fr 1fr 1fr}}

/* ── DASHBOARD ───────────────────────────────────────── */
.dash-wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}
.dash-header{padding:24px 0 0}
.dash-title{font-size:22px;font-weight:600;color:var(--white);margin-bottom:4px}
.dash-sub{font-size:12px;color:var(--ink3);margin-bottom:20px}
.dash-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}

/* Tab nav */
.tab-nav{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}
.tab-btn{padding:12px 18px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:inherit;transition:all .15s}
.tab-btn:hover{color:var(--silver2)}
.tab-btn.active{color:var(--steel2);border-bottom-color:var(--steel2)}

/* Week/day selectors */
.week-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.week-btn{padding:7px 14px;border:1px solid var(--border);border-radius:100px;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:var(--ink3);font-family:inherit;letter-spacing:.06em;transition:all .15s}
.week-btn:hover{border-color:var(--border2);color:var(--silver2)}
.week-btn.active{background:var(--steel);border-color:var(--steel2);color:var(--white)}
.day-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.day-btn{padding:6px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:var(--ink3);font-family:inherit;transition:all .15s}
.day-btn:hover{border-color:var(--border2);color:var(--silver2)}
.day-btn.active{background:var(--steel);border-color:var(--steel2);color:var(--white)}
.day-btn.rest{opacity:.5}

/* Meal cards */

function g(id){return document.getElementById(id);}
function tog(arr,v){var i=arr.indexOf(v);if(i===-1)arr.push(v);else arr.splice(i,1);}
function bind(id,fn){var e=g(id);if(e)e.onclick=fn;}

function getAdj(){
  if(form.goal==='lose'){var d={mild_loss:-250,moderate_loss:-500,aggressive_loss:-750};return d[form.deficitLevel]||-500;}
  if(form.goal==='gain'){var s={lean_gain:200,moderate_gain:400,fast_gain:600};return s[form.surplusLevel]||300;}
  return 0;
}

function doCalc(){
  var w=parseFloat(form.weight),h=parseFloat(form.height),a=parseInt(form.age);
  var bmr=form.sex==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
  var tdee=Math.round(bmr*ACT[form.activity||'moderate']+parseInt(form.steps)*0.02);
  var target=Math.max(1200,tdee+getAdj());
  var protein=Math.round(w*2),fat=Math.round(target*0.25/9);
  var carbs=Math.round((target-protein*4-fat*9)/4);
  return{bmr:Math.round(bmr),tdee:tdee,target:target,protein:protein,fat:fat,carbs:carbs,adj:getAdj()};
}

function mbar(p,c,f){

  return '<div class="mbar-labels"><span style="color:#3d5a85">Protein '+pp+'%</span><span style="color:#6ee7b7">Carbs '+cp+'%</span><span style="color:var(--ink3)">Fat '+fp+'%</span></div>'
    +'<div class="mbar-track"><div class="mbar-seg" style="width:'+pp+'%;background:var(--steel2)"></div><div class="mbar-seg" style="width:'+cp+'%;background:#6ee7b7"></div><div class="mbar-seg" style="width:'+fp+'%;background:var(--border2)"></div></div>';

    var k=typeof list[i]==='object'?list[i].k:list[i];
    var arr=form[field]||[];
    var sel=arr.indexOf(k)!==-1?' sel':'';
    h+='<div class="chip'+sel+'" id="chip-'+field+'-'+i+'">'+v+'</div>';
  }
  return h+'</div>';
}

function bindChips(list,field){
  for(var i=0;i<list.length;i++){
    (function(idx){
      var k=typeof list[idx]==='object'?list[idx].k:list[idx];
      var el=g('chip-'+field+'-'+idx);

}

  // ── STEP 3: TRAINING ─────────────────────────────────────────────────────
  else if(step===3){

  // Step 4

// ── API ──────────────────────────────────────────────────────────────────────
async function generateWeek(weekNum,totalWeeks){
  var c=calc;
  var gl=form.goal==='lose'?'Fat loss':form.goal==='gain'?'Muscle gain':'Maintain/Recomp';
  var adj=getAdj();
  var adjStr=adj===0?'maintenance':adj>0?'+'+adj+' kcal surplus':Math.abs(adj)+' kcal deficit';
  var dietLabel=(DIETS.find(function(d){return d.k===form.dietType;})||{l:'Standard'}).l;
  var cardioStr=form.cardioTypes.length?form.cardioTypes.join(', '):'None';
  var equipStr=form.equipment.length?form.equipment.join(', '):'Not specified';
  var progressNote=totalWeeks>1?'This is week '+weekNum+' of '+totalWeeks+'. '+(weekNum===1?'Start with foundational volume and technique.':weekNum===totalWeeks?'Peak week — maximum intensity and challenge.':'Progress from week '+(weekNum-1)+', increase load or volume by 5-10%.'):'';

  // Build plan-type specific context
  var planContext='';
  if(form.planType==='beginner')planContext='This is a BEGINNER programme. Focus on fundamental movement patterns: squat, hinge, push, pull. Keep exercise selection simple and prioritise form. Include full body or upper/lower splits. No advanced techniques.';
  else if(form.planType==='intermediate')planContext='This is an INTERMEDIATE programme. Include compound lifts with progressive overload, some isolation work. Push/pull/legs or upper/lower splits are appropriate. Include periodisation.';
  else if(form.planType==='advanced')planContext='This is an ADVANCED programme. High volume, intensity techniques (supersets, drop sets), complex movement patterns, advanced periodisation. Assume excellent lifting form and experience.';
  else if(form.planType==='hyrox')planContext='This is a HYROX RACE PREP programme. Combine functional fitness movements (ski erg, sled push/pull, burpee broad jumps, wall balls, sandbag lunges, rowing, farmers carry, running) with zone 2 and threshold running. Structure sessions as race simulations where appropriate.'+(form.raceDate?' Race date: '+form.raceDate+'.':'');
  else if(form.planType==='running')planContext='This is a RUNNING SPECIFIC programme. Structure training as: easy runs (zone 2), tempo runs, interval sessions, and one long run per week. Include strength work to support running performance. Distance goal: '+(form.distanceGoal||'general fitness')+'. Runs per week: '+form.runningDays+'.';
  else if(form.planType==='hybrid')planContext='This is a HYBRID ATHLETE programme. Balance heavy compound strength work with endurance training. Combine gym sessions with cardio sessions. Neither strength nor cardio should suffer — programme them intelligently to avoid interference.';
  else if(form.planType==='booty')planContext='This is a BOOTY BUILDER programme. Prioritise glute hypertrophy: hip thrusts, Romanian deadlifts, Bulgarian split squats, cable kickbacks, abductions, step-ups. Include progressive overload on all glute movements. Support with upper body and core work.';

  var prompt='You are an elite fitness and nutrition coach creating a bespoke programme for ReBourne, a premium fitness brand.\n\n'
    +'PROGRAMME TYPE: '+planLabel()+'\n'
    +'CLIENT: '+form.name+', Goal: '+gl+' ('+adjStr+'), Calories: '+c.target+' kcal/day\n'
    +'Macros: '+c.protein+'g protein, '+c.carbs+'g carbs, '+c.fat+'g fat\n'
    +'Diet: '+dietLabel+', Meals: '+form.meals+' main + '+form.snacks+' snacks\n'
    +'Allergies/Intolerances: '+(form.allergies||'None')+'\n'
    +'Dislikes: '+(form.dislikes||'None')+'\n'
    +'Training days/week: '+form.trainingDays+', Steps/day: '+form.steps+'\n'
    +'Equipment: '+equipStr+'\n'
    +'Cardio available: '+cardioStr+'\n'
    +'Injuries/Limitations: '+(form.injuries||'None')+'\n'
    +'Additional notes: '+(form.notes||'None')+'\n\n'
    +'PROGRAMME CONTEXT: '+planContext+'\n'
    +(progressNote?'WEEK PROGRESSION: '+progressNote+'\n':'')+'\n'
    +'Return ONLY valid JSON, no markdown fences:\n'
    +'{"mealPlan":[{"day":"Monday","meals":[{"type":"Breakfast","name":"...","calories":0,"protein":0,"carbs":0,"fat":0}]}],'
    +'"trainingPlan":[{"day":"Monday","type":"Push","focus":"...","exercises":["Bench press — 4 sets x 8 reps @ RPE 8"]}],'
    +'"coachNotes":"..."}\n'
    +'All 7 days Mon-Sun. Training on '+form.trainingDays+' days, rest on remaining days. Respect all injuries. Follow diet type strictly. Snacks as extra meal entries. Include sets, reps and RPE or % 1RM for training exercises where relevant.';

  var res=await fetch('/api/message',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:8000,messages:[{role:'user',content:prompt}]})
  });
  if(!res.ok){var e=await res.json().catch(function(){return{};});throw new Error((e.error&&e.error.message)||'API error '+res.status);}
  var data=await res.json();
  if(data.stop_reason==='max_tokens')throw new Error('Response cut off on week '+weekNum+'. Please try again.');
  var text='';
  for(var bi=0;bi<data.content.length;bi++){if(data.content[bi].type==='text'){text=data.content[bi].text;break;}}
  var s=text.indexOf('{'),e2=text.lastIndexOf('}');
  if(s===-1||e2<=s)throw new Error('Unexpected response on week '+weekNum+'. Please try again.');
  return JSON.parse(text.slice(s,e2+1));
}

// ── CALENDAR TAB ─────────────────────────────────────────────────────────────
function renderCalendarTab(){
  var html = '';
  var now = new Date();
  var displayDate = new Date(now.getFullYear(), now.getMonth() + dash.calOffset, 1);
  var monthName = displayDate.toLocaleString('en-GB',{month:'long',year:'numeric'});
  var firstDay = displayDate.getDay(); // 0=Sun
  var firstDayMon = (firstDay+6)%7;   // convert to Mon=0
  var daysInMonth = new Date(displayDate.getFullYear(), displayDate.getMonth()+1, 0).getDate();
  var todayDate = now.getDate(), todayMonth = now.getMonth(), todayYear = now.getFullYear();

  html += '<div class="cal-wrap">';
  html += '<div class="cal-month-hd">';
  html += '<button class="cal-nav-btn" id="cal-prev">&larr;</button>';
  html += '<div class="cal-month-title">'+monthName+'</div>';
  html += '<button class="cal-nav-btn" id="cal-next">&rarr;</button>';
  html += '</div>';

  html += '<div class="cal-grid">';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){
    html += '<div class="cal-day-hd">'+d+'</div>';
  });

  // Empty cells before first day
  for(var e=0;e<firstDayMon;e++) html += '<div class="cal-cell empty"></div>';

  // Plan starts from today conceptually - map day 1 of plan to today's week start
  // Week 1 day 1 = Monday of current week (or next Monday)
  var planStartOffset = 0; // days from display month start 1 to plan day 1
  // Simple approach: plan day 1 = first Monday of display month
  var firstMonday = 1 + ((7 - firstDayMon) % 7);

  for(var day=1;day<=daysInMonth;day++){
    var isToday = day===todayDate && displayDate.getMonth()===todayMonth && displayDate.getFullYear()===todayYear;
    // Map this calendar day to plan week/day
    var daysSinceMonday = day - firstMonday;
    var planWeekIdx = Math.floor(daysSinceMonday/7);
    var planDayIdx = ((daysSinceMonday%7)+7)%7;
    var wk = allWeeks[planWeekIdx];
    var trainDay = wk ? (wk.trainingPlan||[])[planDayIdx] : null;
    var mealDay  = wk ? (wk.mealPlan||[])[planDayIdx]     : null;
    var inPlan   = wk && daysSinceMonday>=0;

    html += '<div class="cal-cell'+(isToday?' today':'')+'" id="cal-'+day+'">';
    html += '<div class="cal-date">'+day+'</div>';
    if(inPlan && trainDay){
      var tt = trainDay.type||'';
      var isR = tt==='Rest';
      if(!isR){
        html += '<div class="cal-pill cal-pill-train">'+tt+'</div>';
      } else {
        html += '<div class="cal-pill cal-pill-rest">Rest</div>';
      }
    }
    if(inPlan && mealDay && mealDay.meals && mealDay.meals[0]){
      html += '<div class="cal-pill cal-pill-meal">'+mealDay.meals[0].name.split(' ').slice(0,2).join(' ')+'</div>';
    }
    html += '</div>';
  }
  html += '</div></div>'; // cal-grid, cal-wrap

  // Quick key
  html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">';
  html += '<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3)"><span class="cal-pill cal-pill-train" style="position:static">Training</span></div>';
  html += '<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3)"><span class="cal-pill cal-pill-rest" style="position:static">Rest</span></div>';
  html += '<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3)"><span class="cal-pill cal-pill-meal" style="position:static">Meal preview</span></div>';
  html += '</div>';

  return html;
}

function parseIngredients(mealName, store){
  // Parse meal name into likely ingredients
  // This is heuristic since AI returns meal names not ingredient lists
  // Real recipes come from the modal
  var words = mealName.toLowerCase();
  var map = {
    'chicken':  {name:'Chicken breast',    cat:'Protein',  qty:'150-200g per serving'},
    'salmon':   {name:'Salmon fillet',      cat:'Protein',  qty:'120-150g per serving'},
    'tuna':     {name:'Tuna',               cat:'Protein',  qty:'1 tin per serving'},
    'beef':     {name:'Lean beef mince',    cat:'Protein',  qty:'150g per serving'},
    'egg':      {name:'Eggs',               cat:'Protein',  qty:'2-3 per serving'},
    'turkey':   {name:'Turkey breast',      cat:'Protein',  qty:'150g per serving'},
    'tofu':     {name:'Tofu',               cat:'Protein',  qty:'150g per serving'},
    'oat':      {name:'Oats',               cat:'Carbs',    qty:'60-80g per serving'},
    'rice':     {name:'Brown/white rice',   cat:'Carbs',    qty:'60-80g dry per serving'},
    'pasta':    {name:'Pasta',              cat:'Carbs',    qty:'75-100g dry per serving'},
    'bread':    {name:'Bread / wraps',      cat:'Carbs',    qty:'2 slices per serving'},
    'potato':   {name:'Potatoes',           cat:'Carbs',    qty:'150-200g per serving'},
    'quinoa':   {name:'Quinoa',             cat:'Carbs',    qty:'60g dry per serving'},
    'milk':     {name:'Milk',               cat:'Dairy',    qty:'200-250ml per serving'},
    'yoghurt':  {name:'Greek yoghurt',      cat:'Dairy',    qty:'150-200g per serving'},
    'cheese':   {name:'Cheese',             cat:'Dairy',    qty:'30-40g per serving'},
    'avocado':  {name:'Avocado',            cat:'Healthy fats', qty:'Half per serving'},
    'olive oil':{name:'Olive oil',          cat:'Healthy fats', qty:'1 tbsp per serving'},
    'nut':      {name:'Mixed nuts',         cat:'Healthy fats', qty:'25-30g per serving'},
    'spinach':  {name:'Spinach',            cat:'Vegetables', qty:'Large handful'},
    'broccoli': {name:'Broccoli',           cat:'Vegetables', qty:'100-150g per serving'},
    'pepper':   {name:'Bell peppers',       cat:'Vegetables', qty:'1 per serving'},
    'tomato':   {name:'Tomatoes',           cat:'Vegetables', qty:'2-3 per serving'},
    'banana':   {name:'Banana',             cat:'Fruit',    qty:'1 medium'},
    'berry':    {name:'Mixed berries',      cat:'Fruit',    qty:'80-100g per serving'},
    'apple':    {name:'Apple',              cat:'Fruit',    qty:'1 medium'},
    'protein shake':{name:'Protein powder', cat:'Supplements', qty:'1 scoop per serving'},
    'shake':    {name:'Protein powder',     cat:'Supplements', qty:'1 scoop per serving'},
  };
  Object.keys(map).forEach(function(kw){
    if(words.indexOf(kw)!==-1){
      var item = map[kw];
      if(!store[item.name]) store[item.name] = item;
    }
  });
  // Always add these basics
  if(!store['Seasoning & herbs']) store['Seasoning & herbs'] = {name:'Seasoning & herbs',cat:'Pantry',qty:'As needed'};
  if(!store['Cooking oil'])       store['Cooking oil']       = {name:'Cooking oil',     cat:'Pantry',qty:'As needed'};
}

function groupIngredients(store){
  var cats = {};
  Object.values(store).forEach(function(item){
    if(!cats[item.cat]) cats[item.cat] = [];
    cats[item.cat].push(item);
  });
  return cats;
}

// ── BIND DASHBOARD TAB ───────────────────────────────────────────────────────
function bindDashTab(){
  function bnd(id,fn){var e=g(id);if(e)e.onclick=fn;}

  if(dash.tab==='overview'){
    bnd('ov-dl',downloadPlan);
    bnd('ov-reset',resetAll);
  }

  if(dash.tab==='nutrition'){
    allWeeks.forEach(function(w,i){ bnd('nwk-'+i,function(){dash.week=i;dash.day=0;renderDashboard(g('app'));}); });
    DAYS.forEach(function(d,i){ bnd('nday-'+i,function(){dash.day=i;renderDashboard(g('app'));}); });
    // Bind meal cards -> recipe modal
    var wk=allWeeks[dash.week]||{};
    var dayData=(wk.mealPlan||[])[dash.day]||{meals:[]};
    (dayData.meals||[]).forEach(function(m,mi){
      var key='w'+dash.week+'d'+dash.day+'m'+mi;
      bnd('mc-'+key,function(){openRecipeModal(m,key);});
    });
  }

  if(dash.tab==='training'){
    allWeeks.forEach(function(w,i){ bnd('twk-'+i,function(){dash.week=i;dash.day=0;renderDashboard(g('app'));}); });
    DAYS.forEach(function(d,i){ bnd('tday-'+i,function(){dash.day=i;renderDashboard(g('app'));}); });
    bnd('train-done-btn',function(){
      var key='train-w'+dash.week+'d'+dash.day;
      dash.adherence[key]=!dash.adherence[key];
      renderDashboard(g('app'));
    });
  }

  if(dash.tab==='calendar'){
    bnd('cal-prev',function(){dash.calOffset--;renderDashboard(g('app'));});
    bnd('cal-next',function(){dash.calOffset++;renderDashboard(g('app'));});
    // Day click -> go to that day in nutrition
    var now=new Date();
    var displayDate=new Date(now.getFullYear(),now.getMonth()+dash.calOffset,1);
    var firstDay=displayDate.getDay();
    var firstDayMon=(firstDay+6)%7;
    var daysInMonth=new Date(displayDate.getFullYear(),displayDate.getMonth()+1,0).getDate();
    var firstMonday=1+((7-firstDayMon)%7);
    for(var cd=1;cd<=daysInMonth;cd++){
      (function(day){
        var el=g('cal-'+day);
        if(!el)return;
        el.onclick=function(){
          var diff=day-firstMonday;
          if(diff<0)return;
          var wi=Math.floor(diff/7);
          var di=diff%7;
          if(wi<allWeeks.length){dash.week=wi;dash.day=di;dash.tab='nutrition';renderDashboard(g('app'));window.scrollTo(0,0);}
        };
      })(cd);
    }
  }

  if(dash.tab==='shopping'){
    bnd('shop-daily',function(){dash.shopMode='daily';renderDashboard(g('app'));});
    bnd('shop-weekly',function(){dash.shopMode='weekly';renderDashboard(g('app'));});
    allWeeks.forEach(function(w,i){bnd('swk-'+i,function(){dash.week=i;renderDashboard(g('app'));});});
    DAYS.forEach(function(d,i){bnd('sday-'+i,function(){dash.day=i;renderDashboard(g('app'));});});
    // Bind check items
    var wk2=allWeeks[dash.week]||{};
    var store={};
    if(dash.shopMode==='weekly'){
      (wk2.mealPlan||[]).forEach(function(day){(day.meals||[]).forEach(function(meal){parseIngredients(meal.name,store);});});
    } else {
      var dd=(wk2.mealPlan||[])[dash.day]||{meals:[]};
      (dd.meals||[]).forEach(function(meal){parseIngredients(meal.name,store);});
    }
    var cats2=groupIngredients(store);
    Object.keys(cats2).forEach(function(cat){
      cats2[cat].forEach(function(item,ii){
        var key=cat+'-'+ii+'-'+(dash.shopMode==='weekly'?'w'+dash.week:'d'+dash.day);
        bnd('schk-'+key,function(){dash.checkedShop[key]=!dash.checkedShop[key];renderDashboard(g('app'));});
      });
    });
  }

  if(dash.tab==='progress'){
    allWeeks.forEach(function(w,i){bnd('pwk-'+i,function(){dash.week=i;renderDashboard(g('app'));});});
    var qs2=['energy','hunger','sleep'];
    qs2.forEach(function(qk){
      for(var r=1;r<=5;r++){
        (function(q,rating){
          bnd('ci-'+q+'-'+rating,function(){
            if(!dash.checkins[dash.week])dash.checkins[dash.week]={};
            dash.checkins[dash.week][q]=rating;
            renderDashboard(g('app'));
          });
        })(qk,r);
      }
    });
    // training completion toggles for progress week
    DAYS.forEach(function(d,di){
      var key='train-w'+dash.week+'d'+di;
    });
  }
}

// ── RECIPE MODAL ─────────────────────────────────────────────────────────────
function openRecipeModal(meal, key){
  // If we have a cached recipe, show it immediately
  if(dash.recipeCache[key]){
    showRecipeModal(meal, dash.recipeCache[key], key);
    return;
  }
  // Otherwise generate it
  showRecipeLoadingModal(meal, key);
  generateRecipe(meal, key);
}

function showRecipeLoadingModal(meal, key){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = '<div class="modal"><div class="modal-hd"><div class="modal-title">'+meal.name+'</div><button class="modal-close" id="modal-x">&times;</button></div>'
    +'<div class="modal-body"><div class="spin-wrap" style="padding:2rem 0"><div class="spinner"></div><div>Generating recipe...</div></div></div></div>';
  document.body.appendChild(overlay);
  var mx = g('modal-x');
  if(mx) mx.onclick = closeModal;
  overlay.onclick = function(e){if(e.target===overlay)closeModal();};
}

async function generateRecipe(meal, key){
  try{
    var prompt = 'You are a nutrition coach and chef. Generate a detailed recipe for this meal. '
      +'Meal: '+meal.name+'. '
      +'Target macros: '+meal.calories+' kcal, '+meal.protein+'g protein, '+meal.carbs+'g carbs, '+meal.fat+'g fat. '
      +'Diet type: '+form.dietType+'. '
      +'Allergies to avoid: '+(form.allergies||'None')+'. '
      +'Return ONLY valid JSON with no markdown: '
      +'{"servings":1,"prepTime":"10 mins","cookTime":"20 mins","ingredients":[{"name":"...","amount":"...","category":"Protein"}],"method":["Step 1...","Step 2..."],"tips":"..."}';
    var res = await fetch('/api/message',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1500,messages:[{role:'user',content:prompt}]})
    });
    var data = await res.json();
    var text = (data.content.find(function(b){return b.type==='text';})||{}).text||'';
    var s=text.indexOf('{'),e2=text.lastIndexOf('}');
    var recipe = JSON.parse(text.slice(s,e2+1));
    dash.recipeCache[key] = recipe;
    closeModal();
    showRecipeModal(meal, recipe, key);
  }catch(err){
    closeModal();
    alert('Could not load recipe. Please try again.');
  }
}

function showRecipeModal(meal, recipe, key){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';

  var html = '<div class="modal">';
  html += '<div class="modal-hd"><div><div class="modal-title">'+meal.name+'</div>';
  if(recipe.prepTime) html += '<div style="font-size:11px;color:var(--ink3);margin-top:3px">Prep: '+recipe.prepTime+' &bull; Cook: '+recipe.cookTime+'</div>';
  html += '</div><button class="modal-close" id="modal-x">&times;</button></div>';
  html += '<div class="modal-body">';

  // Macros
  html += '<div class="modal-macros">';
  html += '<div class="modal-macro"><div class="modal-macro-val">'+meal.calories+'</div><div class="modal-macro-lbl">Kcal</div></div>';
  html += '<div class="modal-macro"><div class="modal-macro-val">'+meal.protein+'g</div><div class="modal-macro-lbl">Protein</div></div>';
  html += '<div class="modal-macro"><div class="modal-macro-val">'+meal.carbs+'g</div><div class="modal-macro-lbl">Carbs</div></div>';
  html += '<div class="modal-macro"><div class="modal-macro-val">'+meal.fat+'g</div><div class="modal-macro-lbl">Fat</div></div>';
  html += '</div>';

  // Ingredients
  html += '<div class="modal-section-lbl">Ingredients</div>';
  (recipe.ingredients||[]).forEach(function(ing,ii){
    var ikey = key+'-ing-'+ii;
    var checked = dash.checkedIngredients[ikey];
    html += '<div class="ingredient-row">';
    html += '<div class="ingredient-check'+(checked?' checked':'')+'" id="ing-'+ikey+'">'+(checked?'&#10003;':'')+'</div>';
    html += '<span style="flex:1;'+(checked?'text-decoration:line-through;color:var(--ink3)':'')+'">'+ing.name+'</span>';
    html += '<span style="font-size:11px;color:var(--steel2);font-weight:600;flex-shrink:0">'+ing.amount+'</span>';
    html += '</div>';
  });

  // Method
  html += '<div class="modal-section-lbl" style="margin-top:20px">Method</div>';
  (recipe.method||[]).forEach(function(step,si){
    html += '<div class="method-step"><span class="method-num">'+(si+1)+'</span><span>'+step+'</span></div>';
  });

  // Tips
  if(recipe.tips){
    html += '<div style="background:rgba(58,95,150,.1);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:12px;color:var(--ink3);line-height:1.6;margin-top:16px"><strong style="color:var(--steel2)">Coach tip:</strong> '+recipe.tips+'</div>';
  }

  // Swap button
  html += '<button class="swap-btn" id="swap-btn">&#8635; Swap this meal for an alternative</button>';

  html += '</div></div>'; // modal-body, modal
  overlay.innerHTML = html;
  document.body.appendChild(overlay);

  // Bind
  var mx=g('modal-x');if(mx)mx.onclick=closeModal;
  overlay.onclick=function(e){if(e.target===overlay)closeModal();};

  // Ingredient check toggles
  (recipe.ingredients||[]).forEach(function(ing,ii){
    var ikey=key+'-ing-'+ii;
    var el=g('ing-'+ikey);
    if(el)el.onclick=function(){dash.checkedIngredients[ikey]=!dash.checkedIngredients[ikey];showRecipeModal(meal,recipe,key);};
  });

  // Swap button
  var swapBtn=g('swap-btn');
  if(swapBtn)swapBtn.onclick=function(){swapMeal(meal,key);};
}

function closeModal(){
  var overlay=g('modal-overlay');
  if(overlay)overlay.parentNode.removeChild(overlay);
}

// ── MEAL SWAP ────────────────────────────────────────────────────────────────
async function swapMeal(originalMeal, key){
  var swapBtn=g('swap-btn');
  if(swapBtn){swapBtn.disabled=true;swapBtn.textContent='Finding alternative...';}
  try{
    var prompt = 'You are a nutrition coach. Suggest ONE alternative meal with similar macros. '
      +'Original: '+originalMeal.name+' ('+originalMeal.calories+' kcal, P:'+originalMeal.protein+'g C:'+originalMeal.carbs+'g F:'+originalMeal.fat+'g). '
      +'Meal type: '+originalMeal.type+'. '
      +'Diet: '+form.dietType+', Allergies: '+(form.allergies||'None')+', Dislikes: '+(form.dislikes||'None')+'. '
      'Return ONLY valid JSON no markdown: {"name":"...","calories":0,"protein":0,"carbs":0,"fat":0}';
    var res=await fetch('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:300,messages:[{role:'user',content:prompt}]})});
    var data=await res.json();
    var text=(data.content.find(function(b){return b.type==='text';})||{}).text||'';
    var s=text.indexOf('{'),e2=text.lastIndexOf('}');
    var newMeal=JSON.parse(text.slice(s,e2+1));
    newMeal.type=originalMeal.type;
    // Update in allWeeks
    var parts=key.match(/w(\d+)d(\d+)m(\d+)/);
    if(parts){
      var wi=parseInt(parts[1]),di=parseInt(parts[2]),mi=parseInt(parts[3]);
      if(allWeeks[wi]&&allWeeks[wi].mealPlan&&allWeeks[wi].mealPlan[di]){
        allWeeks[wi].mealPlan[di].meals[mi]=newMeal;
        delete dash.recipeCache[key];
      }
    }
    closeModal();
    renderDashboard(g('app'));
  }catch(err){
    if(swapBtn){swapBtn.disabled=false;swapBtn.textContent='Swap this meal for an alternative';}
    alert('Could not swap meal. Please try again.');
  }
}

render();
</script>
