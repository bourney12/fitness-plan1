<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ReBourne — Reinvent Your Potential</title>
<meta name="description" content="Personalised fitness, nutrition and progress planning.">
<meta name="theme-color" content="#05080F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ReBourne">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="ReBourne">
<meta property="og:description" content="Personalised fitness, nutrition and progress planning.">
<meta property="og:image" content="assets/icons/share-card.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* Core palette */
  --bg:#05080F;--bg2:#080D17;--bg3:#0D1525;
  --card:#0A1120;--card2:#0F1A2E;--card3:#142038;
  --steel:#3A5F96;--steel2:#5B7DB5;--steel3:#7E98BC;
  --white:#F0F4FF;--silver:#B8C8DC;--muted:#6A7D9A;
  --gold:#C9A96E;--gold2:#E8C98A;
  --green:#4ECCA3;--green2:#2d8f7a;
  --purple:#8B5CF6;--purple2:#A78BFA;
  --red:#FF6B6B;
  --border:rgba(58,95,150,.18);--border2:rgba(58,95,150,.32);
  --glow:rgba(58,95,150,.15);
  --r:10px;--rl:16px;--rxl:20px;
}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;line-height:1.5;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

/* ── AMBIENT GLOW ── */
body::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:800px;background:radial-gradient(circle,rgba(58,95,150,.07) 0%,transparent 65%);pointer-events:none;z-index:0}

/* ── TYPOGRAPHY ── */
h1,h2,h3{font-family:'Playfair Display',serif;font-weight:600}
.serif-italic{font-family:'Playfair Display',serif;font-style:italic;font-weight:400}

/* ── LAYOUT ── */
.wrap{max-width:680px;margin:0 auto;padding:0 20px 100px;position:relative;z-index:1}

/* ── HEADER ── */
.site-header{background:rgba(5,8,15,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo-mark{display:flex;align-items:center;gap:12px}
.logo-words{display:flex;flex-direction:column;gap:2px}
.logo-name{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--white);line-height:1}
.logo-name span{color:var(--steel3);font-weight:300}
.logo-tag{font-size:7px;font-weight:500;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.brand-logo-header{width:210px;height:58px;object-fit:contain;display:block;filter:drop-shadow(0 8px 24px rgba(58,95,150,.18))}
.brand-logo-splash{width:min(420px,82vw);display:block;margin:0 auto 34px;filter:drop-shadow(0 18px 46px rgba(58,95,150,.24));opacity:.96}
.brand-logo-loader{width:54px;height:42px;object-fit:contain;display:block}
.brand-logo-print{width:260px;height:auto;display:block;margin:0 auto 10px}
body.splash-mode .site-header{display:none}
body.splash-mode .wrap{padding-top:0}
.hdr-week{font-size:9px;font-weight:600;color:var(--steel3);background:rgba(58,95,150,.12);border:1px solid var(--border);padding:5px 10px;border-radius:100px;letter-spacing:.06em}

/* ── SPLASH ── */
.splash-wordmark{font-size:32px;letter-spacing:.32em;margin-bottom:12px;line-height:1}
.splash-re{font-weight:300;color:var(--steel3)}
.splash-bourne{font-weight:700;color:var(--white)}
.splash-tagline-row{display:flex;align-items:center;gap:14px;margin-bottom:52px}
.splash-line{width:40px;height:1px;background:var(--steel);flex-shrink:0}
.splash-tag{font-size:9px;font-weight:500;letter-spacing:.28em;color:var(--steel3);text-transform:uppercase;white-space:nowrap}
.splash-divider{width:1px;height:40px;background:linear-gradient(to bottom,var(--steel),transparent);margin-bottom:40px}
.splash-headline{font-family:'Playfair Display',serif;font-size:22px;font-weight:400;font-style:italic;color:var(--white);line-height:1.6;margin-bottom:40px;max-width:420px}
.splash-copy{font-size:14px;color:var(--silver);line-height:1.75;max-width:520px;margin:0 auto 32px}
.splash-btn{background:transparent;border:1px solid var(--steel);color:var(--white);font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;padding:16px 48px;border-radius:2px;cursor:pointer;transition:all .3s;font-family:inherit;margin-bottom:16px}
.splash-btn:hover{background:var(--steel);box-shadow:0 4px 30px rgba(58,95,150,.4)}
.splash-sub{font-size:10px;font-weight:400;letter-spacing:.18em;color:var(--steel);text-transform:uppercase;margin-top:12px}
.splash-actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.splash-secondary{background:rgba(58,95,150,.1);border:1px solid var(--border2);color:var(--silver);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:13px 20px;border-radius:var(--r);cursor:pointer;font-family:inherit}
.splash-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 22px}
.splash-mini{background:rgba(13,21,37,.72);border:1px solid var(--border);border-radius:var(--r);padding:10px}
.splash-mini-val{font-size:13px;font-weight:800;color:var(--white);margin-bottom:3px}
.splash-mini-lbl{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--steel3);line-height:1.35}
.entry-wrap{min-height:96vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 18px;background:var(--bg)}
.entry-panel{width:min(760px,100%);background:linear-gradient(145deg,var(--card),rgba(10,17,32,.96));border:1px solid var(--border);border-radius:var(--rl);padding:24px;box-shadow:0 10px 36px rgba(0,0,0,.2)}
.entry-kicker{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--steel3);margin-bottom:10px}
.entry-title{font-size:30px;font-weight:800;color:var(--white);line-height:1.15;letter-spacing:0;margin-bottom:10px}
.entry-sub{font-size:13px;color:var(--silver);line-height:1.7;max-width:560px;margin:0 auto 24px}
.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;margin:0 auto 14px}
.entry-card{background:linear-gradient(145deg,rgba(19,34,54,.9),rgba(8,14,26,.96));border:1px solid var(--border);border-radius:var(--rl);padding:22px;text-align:left;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;font-family:inherit;color:inherit}
.entry-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 14px 38px rgba(58,95,150,.18)}
.entry-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,var(--steel),var(--steel2));opacity:.85}
#entry-membership{background:linear-gradient(145deg,var(--card2),var(--card3));border-color:var(--border2)}
.entry-card-title{font-size:17px;font-weight:800;color:var(--white);margin-bottom:6px}
.entry-card-copy{font-size:12px;color:var(--silver);line-height:1.65;margin-bottom:14px}
.entry-card-meta{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--steel3)}

/* ── LANDING ── */
.hero{text-align:center;padding:60px 20px 40px;position:relative}
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:1px;height:48px;background:linear-gradient(to bottom,transparent,var(--steel))}
.hero-label{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--steel3);margin-bottom:14px;margin-top:52px}
.hero h1{font-size:38px;line-height:1.1;margin-bottom:8px;color:var(--white)}
.hero-tag{font-size:10px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:14px}
.hero-tag::before,.hero-tag::after{content:'';flex:36px 0 0;height:1px;background:var(--steel)}
.hero-sub{font-size:14px;color:var(--silver);line-height:1.8;max-width:460px;margin:0 auto 44px}

/* Feature pills */
.feat-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:44px}
.feat-pill{display:flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--border);border-radius:100px;font-size:12px;color:var(--white);background:var(--card)}
.feat-pill-dot{width:5px;height:5px;border-radius:50%;background:var(--steel2);flex-shrink:0}

/* Plan type cards */
.section-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel3);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.plan-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.pt-card{border:1px solid var(--border);border-radius:var(--rl);padding:18px 14px;cursor:pointer;background:var(--card);transition:all .2s;position:relative;overflow:hidden}
.pt-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--steel),var(--steel3));opacity:0;transition:opacity .2s}
.pt-card:hover{border-color:var(--border2);background:var(--card2)}
.pt-card.sel{border-color:var(--steel2);background:var(--card2)}
.pt-card.sel::before{opacity:1}
.pt-card-icon{font-size:20px;margin-bottom:7px}
.pt-card-title{font-size:13px;font-weight:600;color:var(--white);margin-bottom:3px}
.pt-card-desc{font-size:12px;color:var(--silver);line-height:1.6}
.pt-card-tag{display:inline-block;margin-top:7px;font-size:10px;font-weight:600;letter-spacing:.04em;padding:3px 10px;border-radius:100px;background:rgba(58,95,150,.2);color:var(--steel3)}

/* Duration cards */
.dur-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.dur-card{border:1px solid var(--border);border-radius:var(--r);padding:14px 8px;cursor:pointer;text-align:center;background:var(--card);transition:all .2s;position:relative}
.dur-card.sel{border-color:var(--steel2);background:var(--card2);box-shadow:0 0 20px rgba(58,95,150,.2)}
.dur-pop{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--steel);color:var(--white);font-size:8px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:100px;white-space:nowrap;text-transform:uppercase}
.dur-num{font-family:'Playfair Display',serif;font-size:24px;color:var(--white);margin-bottom:2px}
.dur-label{font-size:10px;font-weight:500;color:var(--silver);margin-bottom:1px}
.dur-desc{font-size:11px;color:var(--silver)}

/* CTA */
.cta-btn{width:100%;padding:15px;border-radius:var(--r);border:none;background:linear-gradient(135deg,var(--steel),var(--steel2));color:var(--white);font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;cursor:pointer;text-transform:uppercase;transition:all .2s;box-shadow:0 4px 20px rgba(58,95,150,.3)}
.cta-btn:hover{box-shadow:0 6px 30px rgba(58,95,150,.5);transform:translateY(-1px)}
.cta-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none;background:var(--card3)}

/* ── PROGRESS BAR ── */
.prog-wrap{padding:16px 0 4px}
.prog-track{height:2px;background:rgba(58,95,150,.15);border-radius:1px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(to right,var(--steel),var(--steel3));border-radius:1px;transition:width .4s}
.prog-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:7px;font-weight:500;letter-spacing:.04em}

/* ── FORM CARD ── */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:26px;margin:16px 0;position:relative;overflow:hidden}
.form-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,var(--steel),transparent)}
.form-card-title{font-size:20px;color:var(--white);margin-bottom:5px}
.form-card-sub{font-size:12px;color:var(--muted);margin-bottom:22px;line-height:1.6}
.field{margin-bottom:.875rem}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--silver);margin-bottom:7px}
.field-hint{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:11px 13px;
  border:1px solid var(--border2);border-radius:var(--r);
  font-family:'Montserrat',sans-serif;font-size:13px;
  color:var(--white);background:rgba(13,21,37,.8);
  outline:none;transition:all .2s;-webkit-appearance:none;appearance:none
}
input:focus,select:focus,textarea:focus{border-color:var(--steel2);box-shadow:0 0 0 3px rgba(58,95,150,.12);background:var(--bg3)}
input.invalid,select.invalid,textarea.invalid{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,107,107,.12)}
textarea{min-height:80px;resize:vertical}
select option{background:var(--bg2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.notice{display:none;margin-bottom:14px;padding:12px 14px;border-radius:var(--r);font-size:12px;font-weight:500;line-height:1.6}
.notice.show{display:block}
.notice.error{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.24);color:var(--red)}
.notice.info{background:rgba(58,95,150,.1);border:1px solid var(--border2);color:var(--silver)}

/* Activity selector */
.act-list{display:flex;flex-direction:column;gap:7px}
.act-opt{border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;cursor:pointer;background:rgba(13,21,37,.5);display:flex;align-items:flex-start;gap:11px;transition:all .2s}
.act-opt:hover{border-color:var(--border2);background:var(--card2)}
.act-opt.sel{border-color:var(--steel2);background:var(--card2);box-shadow:0 0 15px rgba(58,95,150,.15)}
.act-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);margin-top:5px;flex-shrink:0;transition:background .2s}
.act-opt.sel .act-dot{background:var(--steel2)}
.act-title{font-size:13px;font-weight:600;color:var(--white)}
.act-desc{font-size:12px;color:var(--silver);margin-top:2px;line-height:1.5}
.act-ex{font-size:11px;color:var(--steel3);margin-top:3px;font-style:italic}

/* Goal cards */
.goal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:.875rem}
.goal-card{border:1px solid var(--border);border-radius:var(--r);padding:14px 10px;cursor:pointer;text-align:center;background:rgba(13,21,37,.5);transition:all .2s}
.goal-card:hover{border-color:var(--border2);background:var(--card2)}
.goal-card.sel{border-color:var(--steel2);background:var(--card2);box-shadow:0 0 20px rgba(58,95,150,.15)}
.goal-icon{font-size:20px;margin-bottom:6px}
.goal-label{font-size:12px;font-weight:600;color:var(--white)}
.goal-desc{font-size:9px;color:var(--muted);margin-top:2px}

/* Intensity */
.intensity-box{margin-top:13px;padding:14px;background:rgba(13,21,37,.6);border-radius:var(--r);border:1px solid var(--border)}
.intensity-title{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--silver);margin-bottom:11px}
.int-opts{display:flex;flex-direction:column;gap:6px}
.int-opt{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:var(--card);display:flex;justify-content:space-between;align-items:center;transition:all .2s}
.int-opt:hover{border-color:var(--border2)}
.int-opt.sel{border-color:var(--steel2);background:var(--card2)}
.int-label{font-size:12px;font-weight:600;color:var(--white)}
.int-kcal{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px}
.int-detail{font-size:10px;color:var(--muted);margin-top:2px}
.int-badge{font-size:9px;font-weight:600;padding:3px 9px;border-radius:100px;flex-shrink:0;margin-left:10px}
.b-mild{background:rgba(78,204,163,.12);color:var(--green)}
.b-mod{background:rgba(201,169,110,.12);color:var(--gold)}
.b-agg{background:rgba(255,107,107,.1);color:var(--red)}
.b-lean{background:rgba(58,95,150,.2);color:var(--steel3)}
.b-fast{background:rgba(139,92,246,.12);color:var(--purple2)}

/* Diet cards */
.diet-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:.875rem}
.diet-card{border:1px solid var(--border);border-radius:var(--r);padding:11px 9px;cursor:pointer;text-align:center;background:rgba(13,21,37,.5);transition:all .2s}
.diet-card:hover{border-color:var(--border2)}
.diet-card.sel{border-color:var(--steel2);background:var(--card2)}
.diet-label{font-size:11px;font-weight:600;color:var(--white)}
.diet-desc{font-size:9px;color:var(--muted);margin-top:2px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:.75rem}
.chip{padding:6px 13px;border-radius:100px;border:1px solid var(--border);font-size:11px;font-weight:500;cursor:pointer;background:rgba(13,21,37,.5);color:var(--muted);transition:all .2s;font-family:'Montserrat',sans-serif}
.chip:hover{border-color:var(--border2);color:var(--silver)}
.chip.sel{background:var(--steel);border-color:var(--steel2);color:var(--white);box-shadow:0 2px 12px rgba(58,95,150,.3)}
.sec-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--silver);margin:1.25rem 0 .75rem;display:flex;align-items:center;gap:10px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}

/* Slider */
.sl-wrap{position:relative;padding-top:22px;margin-bottom:.5rem}
.sl-val{position:absolute;right:0;top:0;font-size:12px;font-weight:600;color:var(--steel3)}
input[type=range]{padding:0;border:none;background:var(--border);height:3px;border-radius:2px;accent-color:var(--steel2);box-shadow:none;width:100%}

/* Buttons */
.btn-row{display:flex;gap:9px;margin-top:1.5rem}
.nav-btn{padding:11px 20px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;cursor:pointer;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;transition:all .2s}
.nav-btn:hover{color:var(--white);border-color:var(--silver)}
.pri-btn{flex:1;background:linear-gradient(135deg,var(--steel),var(--steel2));border:none;border-radius:var(--r);padding:12px;font-size:11px;font-weight:700;color:var(--white);cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:.09em;text-transform:uppercase;transition:all .2s;box-shadow:0 3px 15px rgba(58,95,150,.25)}
.pri-btn:hover{box-shadow:0 5px 25px rgba(58,95,150,.4);transform:translateY(-1px)}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:.875rem}
.stat{background:var(--card);border-radius:var(--r);padding:13px;border:1px solid var(--border);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,var(--steel),transparent);opacity:0;transition:opacity .3s}
.stat.hi{background:linear-gradient(135deg,var(--steel),var(--steel2));border-color:var(--steel2);box-shadow:0 4px 20px rgba(58,95,150,.25)}
.stat.hi::before{display:none}
.stat-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.stat.hi .stat-lbl{color:rgba(255,255,255,.65)}
.stat-val{font-size:20px;font-weight:700;color:var(--white);font-family:'Playfair Display',serif}
.stat-unit{font-size:10px;color:var(--muted);margin-top:2px}
.stat.hi .stat-unit{color:rgba(255,255,255,.6)}
.mbar-labels{display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:5px}
.mbar-track{height:5px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden;display:flex;margin-bottom:.875rem}
.mbar-seg{height:100%}

/* Spinner */
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:3rem 0;color:var(--muted);font-size:13px}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--steel2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOADING SCREEN ──────────────────────────────── */
.loading-screen{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;position:relative;overflow:hidden}
.loading-screen::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);width:500px;height:500px;background:radial-gradient(circle,rgba(58,95,150,.12) 0%,transparent 65%);pointer-events:none;border-radius:50%;animation:glowPulse 3s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.6;transform:translate(-50%,-55%) scale(1)}50%{opacity:1;transform:translate(-50%,-55%) scale(1.15)}}

/* Ring spinner */
.load-ring-wrap{position:relative;width:120px;height:120px;margin-bottom:32px;flex-shrink:0}
.load-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;animation:ringRotate 2s linear infinite}
.load-ring-1{border-top-color:var(--steel2);border-right-color:rgba(58,95,150,.3);animation-duration:2s}
.load-ring-2{inset:10px;border-top-color:var(--steel3);border-left-color:rgba(126,152,188,.2);animation-duration:1.5s;animation-direction:reverse}
.load-ring-3{inset:20px;border-top-color:var(--gold);border-right-color:rgba(201,169,110,.15);animation-duration:3s}
@keyframes ringRotate{to{transform:rotate(360deg)}}
.load-ring-logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

/* Steps progress */
.load-steps{width:100%;max-width:360px;margin-bottom:32px}
.load-step{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r);margin-bottom:6px;transition:all .5s;opacity:.3;font-size:12px;color:var(--muted)}
.load-step.active{opacity:1;background:rgba(58,95,150,.1);border:1px solid var(--border);color:var(--white)}
.load-step.done{opacity:.7;color:var(--green)}
.load-step-icon{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:all .5s}
.load-step.active .load-step-icon{border-color:var(--steel2);background:rgba(58,95,150,.2);color:var(--steel2)}
.load-step.done .load-step-icon{border-color:var(--green);background:rgba(78,204,163,.15);color:var(--green)}

/* Warning banner */
.load-warning{display:flex;align-items:flex-start;gap:10px;background:rgba(201,169,110,.08);border:1px solid rgba(201,169,110,.25);border-radius:var(--r);padding:12px 16px;max-width:380px;text-align:left;margin-top:8px}
.load-warning-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.load-warning-text{font-size:11px;color:var(--gold);line-height:1.6;font-weight:500}
.load-warning-text strong{display:block;margin-bottom:2px;font-size:12px}

/* Fact cards */
.load-fact{max-width:360px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--rl);font-size:12px;color:var(--silver);line-height:1.7;margin-top:20px;font-style:italic;position:relative;overflow:hidden}
.load-fact::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,var(--steel),transparent)}
.load-fact-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel3);margin-bottom:6px;font-style:normal}

/* Progress dots */
.load-progress-dots{display:flex;gap:6px;margin-top:16px}
.lpd{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background .4s}
.lpd.active{background:var(--steel2)}
.lpd.done{background:var(--green)}
.err-box{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);border-radius:var(--r);padding:14px;font-size:12px;color:var(--red);margin-bottom:.875rem}
.disclaimer{background:rgba(201,169,110,.06);border:1px solid rgba(201,169,110,.18);border-radius:var(--r);padding:11px 14px;font-size:11px;color:var(--gold);margin-bottom:.875rem;line-height:1.6}

/* ── DASHBOARD ── */
.dash-wrap{max-width:900px;margin:0 auto;padding:0 0 100px}
.dash-header{padding:22px 20px 0}
.dash-title{font-size:20px;color:var(--white);margin-bottom:4px}
.dash-sub{font-size:11px;color:var(--muted);margin-bottom:16px}
.dash-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}

/* Context bar */
.dash-context-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);margin-bottom:20px;background:rgba(5,8,15,.4)}
.dash-context-title{font-size:16px;font-weight:600;color:var(--white)}
.dash-context-sub{font-size:10px;color:var(--muted);margin-top:2px}
.dash-context-badge{font-size:9px;font-weight:600;letter-spacing:.06em;padding:5px 12px;border-radius:100px;background:rgba(58,95,150,.15);color:var(--steel3);border:1px solid var(--border)}

/* Bottom nav */
.dash-bottom-nav{display:flex;border-top:1px solid var(--border);background:rgba(5,8,15,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);position:sticky;bottom:0;z-index:50;padding:7px 8px calc(9px + env(safe-area-inset-bottom));gap:6px}
.dbn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:62px;padding:9px 4px 10px;cursor:pointer;color:var(--muted);transition:all .2s;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid transparent;border-radius:var(--r);background:transparent;font-family:inherit;position:relative;min-width:0}
.dbn:hover{color:var(--silver)}
.dbn.active{color:var(--white);background:rgba(58,95,150,.16);border-color:var(--border2);box-shadow:0 8px 26px rgba(58,95,150,.16)}
.dbn.active::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:36px;height:3px;background:linear-gradient(to right,var(--steel),var(--steel3));border-radius:0 0 3px 3px}
.dbn-icon{width:22px;height:22px;color:currentColor;display:block;opacity:.9}
.dbn span{font-size:10px;font-weight:800;letter-spacing:.045em;white-space:nowrap}

/* Week/day nav */
.week-nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.week-btn{padding:6px 13px;border:1px solid var(--border);border-radius:100px;font-size:10px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);font-family:inherit;letter-spacing:.05em;transition:all .2s}
.week-btn:hover{border-color:var(--border2);color:var(--silver)}
.week-btn.active{background:var(--steel);border-color:var(--steel2);color:var(--white);box-shadow:0 2px 12px rgba(58,95,150,.3)}
.day-nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}
.day-btn{padding:6px 11px;border:1px solid var(--border);border-radius:var(--r);font-size:10px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);font-family:inherit;transition:all .2s;position:relative}
.day-btn:hover{border-color:var(--border2);color:var(--silver)}
.day-btn.active{background:var(--steel);border-color:var(--steel2);color:var(--white)}
.day-btn.rest{opacity:.45}

/* Meal cards */
.meal-card{border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:9px;cursor:pointer;background:var(--card);transition:all .2s;position:relative;overflow:hidden}
.meal-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--steel),var(--steel3));opacity:0;transition:opacity .2s;border-radius:2px 0 0 2px}
.meal-card:hover{border-color:var(--border2);background:var(--card2)}
.meal-card:hover::before,.meal-card.eaten::before{opacity:1}
.meal-card.eaten{border-color:rgba(78,204,163,.2);background:rgba(78,204,163,.03)}
.meal-card.eaten::before{background:linear-gradient(to bottom,var(--green),var(--green2))}
.meal-card-top{display:flex;justify-content:space-between;align-items:flex-start}
.meal-card-type{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel3);margin-bottom:3px}
.meal-card-name{font-size:13px;font-weight:600;color:var(--white)}
.meal-card-macros{font-size:10px;color:var(--muted);margin-top:3px}
.meal-card-cals{font-size:15px;font-weight:700;color:var(--white);text-align:right;flex-shrink:0;margin-left:12px}
.meal-card-hint{font-size:9px;color:var(--steel3);margin-top:8px;letter-spacing:.05em}
.meal-card-actions{display:flex;gap:6px;margin-top:10px}
.quick-add-meal{width:100%;margin:0 0 10px;padding:11px 14px;border-radius:var(--r);border:1px dashed var(--border2);background:rgba(58,95,150,.08);color:var(--steel3);font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.quick-add-meal:hover{border-style:solid;background:rgba(58,95,150,.16);color:var(--white)}
.saved-meal-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.saved-meal-btn{border:1px solid var(--border);border-radius:var(--r);background:rgba(13,21,37,.68);color:var(--silver);font-family:inherit;text-align:left;padding:10px;cursor:pointer;transition:all .2s}
.saved-meal-btn:hover{border-color:var(--border2);background:var(--card2);color:var(--white)}
.saved-meal-name{font-size:11px;font-weight:800;color:var(--white);line-height:1.35;margin-bottom:4px}
.saved-meal-meta{font-size:9px;color:var(--muted);line-height:1.45}
.save-fav-row{display:flex;align-items:center;gap:9px;padding:10px 0 2px;color:var(--silver);font-size:11px;font-weight:600}
.save-fav-row input{width:16px;height:16px;accent-color:var(--steel2)}
.meal-action-btn{flex:1;padding:8px;border-radius:var(--r);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.04em;transition:all .2s;text-align:center}
.meal-action-recipe{border:1px solid var(--border2);background:transparent;color:var(--steel3)}
.meal-action-recipe:hover{border-color:var(--steel2);background:rgba(58,95,150,.1)}
.meal-action-swap{border:1px solid var(--border);background:transparent;color:var(--muted)}
.meal-action-swap:hover{border-color:var(--border2);color:var(--white)}
.meal-action-swap.loading{opacity:.4;cursor:not-allowed}
.meal-day-total{display:flex;justify-content:space-between;padding:11px 15px;background:var(--card2);border-radius:var(--r);margin-bottom:14px;font-size:12px;font-weight:600;border:1px solid var(--border)}

/* Today section */
.today-section{margin-bottom:18px}
.today-section-hd{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--steel3);margin-bottom:10px;display:flex;align-items:center;gap:9px}
.today-section-hd::after{content:'';flex:1;height:1px;background:var(--border)}

/* Rings */
.ring-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.ring-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:13px 9px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;transition:border-color .2s}
.ring-card:hover{border-color:var(--border2)}
.ring{position:relative;width:48px;height:48px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--white)}
.ring-info-title{font-size:11px;font-weight:600;color:var(--white);margin-bottom:2px}
.ring-info-sub{font-size:10px;color:var(--muted)}
.today-glance-panel{background:linear-gradient(145deg,var(--card),rgba(16,28,48,.94));border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:14px}
.today-glance-top{display:grid;grid-template-columns:1.05fr .95fr;gap:10px;margin-bottom:10px}
.macro-ring-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.macro-ring-card{background:rgba(13,21,37,.68);border:1px solid var(--border);border-radius:var(--r);padding:12px 10px;display:flex;align-items:center;gap:10px;min-height:78px}
.macro-ring-card.calories{flex-direction:row;justify-content:flex-start;text-align:left}
.macro-ring-card .ring{width:54px;height:54px}
.macro-ring-card .ring-label{font-size:10px}
.macro-ring-title{font-size:11px;font-weight:700;color:var(--white);margin-bottom:2px}
.macro-ring-sub{font-size:10px;color:var(--muted);line-height:1.35}
.today-hero{background:linear-gradient(135deg,rgba(58,95,150,.20),rgba(10,17,32,.78));border:1px solid var(--border);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.today-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.04),transparent 48%);pointer-events:none}
.today-hero-title{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--steel3);margin-bottom:4px;position:relative}
.today-hero-main{font-family:'Montserrat',sans-serif;font-size:34px;font-weight:800;line-height:1;color:var(--white);position:relative;letter-spacing:0}
.today-hero-sub{font-size:11px;color:var(--silver);margin-top:6px;position:relative}
.today-target-card{background:rgba(13,21,37,.68);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px}
.today-target-card .ring{width:72px;height:72px}
.today-target-card .ring-label{font-size:13px}
.swap-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Macro bars */
.mb-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:15px;margin-bottom:14px;position:relative;overflow:hidden}
.mb-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,rgba(58,95,150,.3),transparent)}
.mb-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.mb-row:last-child{margin-bottom:0}
.mb-label{font-size:10px;font-weight:600;width:48px;flex-shrink:0}
.mb-track{flex:1;height:5px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden}
.mb-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.mb-num{font-size:10px;font-weight:700;color:var(--white);text-align:right;width:68px;flex-shrink:0}

/* Session card */
.session-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:10px;box-shadow:0 4px 24px rgba(58,95,150,.08)}
.session-hd{padding:14px 16px;background:linear-gradient(135deg,var(--card2),var(--card3));display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--border)}
.session-title{font-size:14px;font-weight:600;color:var(--white);margin-bottom:3px}
.session-focus{font-size:10px;color:var(--silver);font-style:italic}
.session-type-badge{font-size:9px;font-weight:700;padding:4px 10px;border-radius:100px;letter-spacing:.06em;flex-shrink:0}
.ex-list{padding:4px 0}
.ex-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--silver)}
.ex-row:last-child{border-bottom:none}
.ex-num{font-size:9px;font-weight:700;color:var(--steel3);width:18px;flex-shrink:0}
.rest-card{border:1px solid var(--border);border-radius:var(--rl);padding:20px;text-align:center;color:var(--muted);font-size:12px;font-style:italic;background:var(--card)}

/* Water tracker */
.water-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:18px;margin-bottom:14px}
.wc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.wc-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel3)}
.wc-hint{font-size:9px;color:var(--muted);margin-top:2px}
.wc-amount{font-size:20px;font-weight:700;color:var(--white);text-align:right;line-height:1}
.wc-goal-lbl{font-size:9px;color:var(--muted);text-align:right}
.wc-track{height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden;margin-bottom:13px;position:relative}
.wc-fill{height:100%;background:linear-gradient(to right,var(--steel),var(--steel3));border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.wc-glasses{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px}
.water-glass{width:30px;height:38px;border:1.5px solid var(--border);border-radius:3px;cursor:pointer;overflow:hidden;display:flex;align-items:flex-end;transition:border-color .2s}
.water-glass.filled{border-color:var(--steel2)}
.water-fill{width:100%;background:linear-gradient(to top,var(--steel),var(--steel2));transition:height .35s}
.wc-btns{display:flex;gap:6px}
.water-btn{flex:1;padding:9px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--steel3);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.04em;transition:all .2s}
.water-btn:hover{background:var(--steel);border-color:var(--steel2);color:var(--white);box-shadow:0 3px 14px rgba(58,95,150,.3)}
.water-btn.undo{color:var(--muted)}

/* Cardio */
.cardio-log-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:14px}
.cardio-form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.cardio-field label{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--silver);margin-bottom:5px}
.cardio-log-list{display:flex;flex-direction:column;gap:6px}
.cardio-log-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(13,21,37,.6);border-radius:var(--r);border:1px solid var(--border)}
.cardio-log-left{display:flex;align-items:center;gap:9px}
.cardio-icon{font-size:18px}
.cardio-name{font-size:12px;font-weight:500;color:var(--white)}
.cardio-meta{font-size:9px;color:var(--muted);margin-top:1px}
.cardio-cals-burned{font-size:12px;font-weight:700;color:var(--gold)}
.cardio-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;transition:color .2s}
.cardio-remove:hover{color:var(--red)}
.log-btn{width:100%;padding:11px;border-radius:var(--r);border:none;background:linear-gradient(135deg,var(--steel),var(--steel2));color:var(--white);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all .2s;box-shadow:0 3px 14px rgba(58,95,150,.25)}
.log-btn:hover{box-shadow:0 5px 20px rgba(58,95,150,.4)}

/* Sleep card */
.sleep-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.sleep-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--purple),var(--purple2));opacity:.6}
.sleep-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.sleep-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--purple2)}
.sleep-score{text-align:right}
.sleep-score-num{font-size:22px;font-weight:700;color:var(--white);line-height:1}
.sleep-score-lbl{font-size:9px;color:var(--muted)}
.sleep-time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sleep-time-field label{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--silver);margin-bottom:5px}
.sleep-quality-row{display:flex;gap:6px;margin-bottom:14px}
.sleep-q-btn{flex:1;padding:9px;border-radius:var(--r);border:1px solid var(--border);background:transparent;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .2s;text-align:center}
.sleep-q-btn:hover{border-color:var(--border2);color:var(--white)}
.sleep-q-btn.sel{background:rgba(139,92,246,.15);border-color:var(--purple);color:var(--purple2)}
.sleep-insight{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2);border-radius:var(--r);font-size:11px;color:var(--silver);line-height:1.6}
.sleep-insight-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.sleep-stage-bar{height:8px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden;display:flex;margin-bottom:10px}
.sleep-stage{height:100%;border-radius:4px}

/* Workout logging */
.ex-log-wrap{background:rgba(13,21,37,.6);border-radius:var(--r);margin-top:7px;padding:10px 12px;border:1px solid var(--border)}
.ex-log-title{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel3);margin-bottom:8px}
.set-row{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.set-num{font-size:10px;font-weight:700;color:var(--muted);width:30px;flex-shrink:0}
.log-input{padding:7px 9px;border:1px solid var(--border2);border-radius:var(--r);background:var(--card);color:var(--white);font-family:inherit;font-size:12px;font-weight:600;outline:none;text-align:center;transition:border-color .2s}
.log-input:focus{border-color:var(--steel2)}
.log-input.weight{width:68px}
.log-input.reps{width:54px}
.log-input-lbl{font-size:9px;color:var(--muted);flex-shrink:0}
.add-set-btn{font-size:10px;font-weight:600;color:var(--steel3);background:none;border:1px solid var(--border);border-radius:var(--r);padding:5px 12px;cursor:pointer;font-family:inherit;margin-top:4px;letter-spacing:.04em;transition:all .2s}
.add-set-btn:hover{border-color:var(--steel2);color:var(--white)}
.pb-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:100px;background:rgba(201,169,110,.12);color:var(--gold);font-size:9px;font-weight:700;margin-left:7px;border:1px solid rgba(201,169,110,.2)}
.overload-panel{margin:9px 0 10px;background:linear-gradient(145deg,rgba(13,21,37,.72),rgba(10,17,32,.86));border:1px solid var(--border);border-radius:var(--r);padding:11px}
.overload-panel.empty{border-style:dashed;background:rgba(13,21,37,.38)}
.overload-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
.overload-title{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--steel3)}
.overload-badge{font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:100px;padding:3px 8px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.overload-badge.progress{background:rgba(78,204,163,.1);border-color:rgba(78,204,163,.24);color:var(--green)}
.overload-badge.hold{background:rgba(201,169,110,.1);border-color:rgba(201,169,110,.22);color:var(--gold)}
.overload-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}
.overload-stat{background:rgba(5,8,15,.32);border:1px solid var(--border);border-radius:8px;padding:8px}
.overload-stat-val{font-size:13px;font-weight:800;color:var(--white);line-height:1.1}
.overload-stat-lbl{font-size:8px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:3px;line-height:1.3}
.overload-target{font-size:11px;color:var(--silver);line-height:1.55}
.overload-target strong{color:var(--white)}
.overload-note{font-size:10px;color:var(--muted);line-height:1.45;margin-top:6px}

/* Charts */
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:13px;position:relative;overflow:hidden}
.chart-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,var(--steel),transparent);opacity:.3}
.chart-title{font-size:12px;font-weight:600;color:var(--white);margin-bottom:13px;display:flex;justify-content:space-between;align-items:center}
.macro-card{padding:20px}
.macro-layout{display:grid;grid-template-columns:190px 1fr;gap:24px;align-items:center}
.macro-donut{width:176px;height:176px}
.macro-list{display:flex;flex-direction:column;gap:10px}
.macro-row{display:grid;grid-template-columns:14px minmax(82px,1fr) auto 42px;align-items:center;gap:9px;font-size:13px}
.macro-dot{width:12px;height:12px;border-radius:3px}
.macro-name{color:var(--silver);font-weight:600}
.macro-value{font-weight:800;color:var(--white)}
.macro-percent{color:var(--muted);text-align:right}
.macro-track{grid-column:2 / 5;height:5px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
.macro-fill{height:100%;border-radius:3px}
.adh-wheel-card{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:13px}
.adh-wheel-card .ring{width:76px;height:76px}
.adh-wheel-card .ring-label{font-size:13px}
.adh-wheel-title{font-size:14px;font-weight:700;color:var(--white);margin-bottom:4px}
.adh-wheel-sub{font-size:12px;color:var(--silver);line-height:1.6}
.supp-compact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.supp-compact{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px}
.supp-compact-icon{font-size:18px;line-height:1}
.supp-compact-name{font-size:11px;font-weight:700;color:var(--white)}
.supp-compact-dose{font-size:10px;color:var(--steel3);margin-top:2px}
.ov-actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.ov-actions .dl-btn-sm,.ov-actions .reset-btn{width:auto;margin-top:0;min-width:210px}
.ov-actions .dl-btn-sm{background:linear-gradient(135deg,var(--steel),var(--steel2));border-color:var(--steel2);color:var(--white);box-shadow:0 8px 24px rgba(58,95,150,.28)}
.training-hero,.progress-hero{background:linear-gradient(135deg,rgba(58,95,150,.22),rgba(10,17,32,.94));border:1px solid var(--border2);border-radius:var(--rl);padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
.training-hero::after,.progress-hero::after{content:'';position:absolute;right:-70px;top:-80px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(126,152,188,.14)}
.training-hero-title,.progress-hero-title{font-size:22px;font-weight:700;color:var(--white);margin-bottom:4px}
.training-hero-sub,.progress-hero-sub{font-size:12px;color:var(--silver);margin-bottom:10px}
.training-hero-tags{display:flex;gap:7px;flex-wrap:wrap}
.training-tag{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--steel3);background:rgba(58,95,150,.16);border:1px solid var(--border);border-radius:100px;padding:5px 11px}
.performance-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.performance-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:14px}
.performance-val{font-family:'Montserrat',sans-serif;font-size:25px;font-weight:800;color:var(--white);line-height:1;white-space:nowrap;letter-spacing:0}
.performance-lbl{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--steel3);margin-top:7px}
.performance-sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.slider-metric{margin-bottom:14px}
.slider-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.slider-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--silver)}
.slider-value{font-size:12px;font-weight:800;color:var(--steel3)}
.wellness-slider{width:100%;height:5px;padding:0;border:none;background:rgba(255,255,255,.07);accent-color:var(--steel2);box-shadow:none}
.chart-select{padding:4px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--midnight2,var(--bg3));color:var(--white);font-family:inherit;font-size:10px;outline:none}
.chart-svg{width:100%;overflow:visible}
.chart-line{fill:none;stroke:var(--steel2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart-line-gold{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart-line-green{fill:none;stroke:var(--green);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart-line-purple{fill:none;stroke:var(--purple2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart-dot{fill:var(--steel2);stroke:var(--card);stroke-width:2}
.chart-dot-gold{fill:var(--gold);stroke:var(--card);stroke-width:2}
.chart-dot-green{fill:var(--green);stroke:var(--card);stroke-width:2}
.chart-dot-purple{fill:var(--purple2);stroke:var(--card);stroke-width:2}
.chart-label{font-size:9px;fill:var(--muted);font-family:inherit}
.chart-val{font-size:10px;font-weight:700;fill:var(--white);font-family:inherit}
.chart-empty{text-align:center;padding:28px;color:var(--muted);font-size:11px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}

/* Progress photos */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.photo-cell{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;cursor:pointer;position:relative;background:var(--card2);display:flex;align-items:center;justify-content:center;transition:border-color .2s}
.photo-cell:hover{border-color:var(--border2)}
.photo-cell img{width:100%;height:100%;object-fit:cover}
.photo-cell-empty{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:10px;font-weight:500;padding:14px}
.photo-cell-empty i{font-size:22px}
.photo-week-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(5,8,15,.75);backdrop-filter:blur(4px);padding:4px 7px;font-size:9px;font-weight:600;color:var(--white);text-align:center;letter-spacing:.06em}
.photo-upload-input{display:none}
.photo-compare{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.photo-compare-cell{border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;position:relative;background:var(--card2)}
.photo-compare-cell img{width:100%;height:100%;object-fit:cover}
.photo-compare-lbl{position:absolute;top:7px;left:7px;background:rgba(58,95,150,.8);backdrop-filter:blur(4px);padding:3px 9px;border-radius:100px;font-size:9px;font-weight:700;color:var(--white);letter-spacing:.06em}

/* Shopping */
.shop-toggle{display:flex;gap:6px;margin-bottom:14px}
.shop-t-btn{padding:7px 15px;border:1px solid var(--border);border-radius:100px;font-size:10px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);font-family:inherit;letter-spacing:.05em;transition:all .2s}
.shop-t-btn.active{background:var(--steel);border-color:var(--steel2);color:var(--white);box-shadow:0 2px 12px rgba(58,95,150,.25)}
.shop-category{margin-bottom:18px}
.shop-cat-title{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--steel3);margin-bottom:10px;display:flex;align-items:center;gap:9px}
.shop-cat-title::after{content:'';flex:1;height:1px;background:var(--border)}
.shop-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--silver)}
.shop-item:last-child{border-bottom:none}
.shop-check{width:18px;height:18px;border:1px solid var(--border2);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:10px}
.shop-check.checked{background:var(--steel);border-color:var(--steel2);color:var(--white)}
.shop-qty{font-size:10px;color:var(--steel3);font-weight:600;margin-left:auto;flex-shrink:0}

/* Progress / adherence */
.checkin-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:18px;margin-bottom:11px}
.checkin-q{font-size:13px;font-weight:600;color:var(--white);margin-bottom:12px}
.rating-row{display:flex;gap:7px}
.rating-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center}
.rating-btn:hover{border-color:var(--border2);color:var(--white)}
.rating-btn.sel{background:var(--steel);border-color:var(--steel2);color:var(--white);box-shadow:0 2px 10px rgba(58,95,150,.3)}
.check-item{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;background:var(--card);transition:all .2s}
.check-item:hover{border-color:var(--border2)}
.check-item.done{border-color:rgba(78,204,163,.25);background:rgba(78,204,163,.04)}
.check-box{width:20px;height:20px;border:1.5px solid var(--border2);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:11px}
.check-item.done .check-box{background:var(--green);border-color:var(--green);color:#000}
.check-label{font-size:12px;color:var(--silver);flex:1}
.check-item.done .check-label{color:var(--muted);text-decoration:line-through}

/* Supplements */
.supp-card{border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:9px;background:var(--card);display:flex;align-items:flex-start;gap:13px;transition:border-color .2s}
.supp-card:hover{border-color:var(--border2)}
.supp-icon{font-size:20px;flex-shrink:0}
.supp-name{font-size:12px;font-weight:600;color:var(--white);margin-bottom:3px}
.supp-desc{font-size:11px;color:var(--muted);line-height:1.5}
.supp-dose{font-size:10px;color:var(--steel3);font-weight:600;margin-top:4px}

/* Badges */
.bdg{display:inline-flex;align-items:center;padding:4px 11px;border-radius:100px;font-size:10px;font-weight:600;letter-spacing:.04em}
.bdg-steel{background:rgba(58,95,150,.15);color:var(--steel3);border:1px solid var(--border)}
.bdg-gold{background:rgba(201,169,110,.12);color:var(--gold);border:1px solid rgba(201,169,110,.2)}
.bdg-red{background:rgba(255,107,107,.08);color:var(--red);border:1px solid rgba(255,107,107,.18)}
.bdg-purple{background:rgba(139,92,246,.1);color:var(--purple2);border:1px solid rgba(139,92,246,.2)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.875rem}

/* Overview cards */
.ov-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:.875rem}
.ov-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:14px;text-align:center;position:relative;overflow:hidden;transition:border-color .2s}
.ov-card:hover{border-color:var(--border2)}
.ov-val{font-family:'Playfair Display',serif;font-size:22px;color:var(--white);margin-bottom:2px}
.ov-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.ov-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;background:rgba(126,152,188,.12);border:1px solid var(--border);color:var(--steel3);font-size:14px;font-weight:800}
.ov-card.hi .ov-icon{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:var(--white)}
.ov-meter{height:4px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-top:10px}
.ov-meter-fill{height:100%;border-radius:3px;background:linear-gradient(to right,var(--steel),var(--green))}
.coach-note-box{border-left:2px solid var(--steel2);padding:12px 15px;background:var(--card);border-radius:0 var(--r) var(--r) 0;font-size:13px;color:var(--silver);line-height:1.8;margin-bottom:18px;font-style:italic}

/* Misc */
.dl-btn-sm{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--r);border:1px solid var(--steel);background:transparent;color:var(--steel3);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.08em;text-transform:uppercase;transition:all .2s}
.dl-btn-sm:hover{background:var(--steel);color:var(--white)}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;border-radius:var(--r);border:none;background:linear-gradient(135deg,var(--steel),var(--steel2));color:var(--white);font-size:11px;font-weight:700;cursor:pointer;margin-top:.75rem;font-family:inherit;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 3px 15px rgba(58,95,150,.25);transition:all .2s}
.dl-btn:hover{box-shadow:0 5px 25px rgba(58,95,150,.4);transform:translateY(-1px)}
.reset-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:11px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;margin-top:.5rem;font-family:inherit;letter-spacing:.06em;text-transform:uppercase;transition:all .2s}
.reset-btn:hover{border-color:var(--border2);color:var(--silver)}

/* Workout session complete */
.sf-done{padding:11px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--silver);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s;flex:1}
.sf-done.done{background:rgba(78,204,163,.08);border-color:rgba(78,204,163,.3);color:var(--green)}

/* Adherence */
.adh-row{margin-bottom:11px}

/* Measurements */
.meas-wrap{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,8,15,.88);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card2);border-radius:var(--rl) var(--rl) 0 0;border:1px solid var(--border2);border-bottom:none;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:0 0 40px}
.modal-hd{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--card2);backdrop-filter:blur(12px);z-index:1}
.modal-title{font-size:17px;font-weight:600;color:var(--white)}
.modal-close{background:none;border:1px solid var(--border);border-radius:50%;width:30px;height:30px;color:var(--muted);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;transition:all .2s}
.modal-close:hover{border-color:var(--border2);color:var(--white)}
.modal-body{padding:18px 22px}
.modal-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:18px}
.modal-macro{background:var(--bg3);border-radius:var(--r);padding:10px;text-align:center;border:1px solid var(--border)}
.modal-macro-val{font-size:17px;font-weight:700;color:var(--white)}
.modal-macro-lbl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-top:2px}
.modal-section-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--steel3);margin-bottom:10px;display:flex;align-items:center;gap:9px}
.modal-section-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.ingredient-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--silver)}
.ingredient-row:last-child{border-bottom:none}
.ingredient-check{width:16px;height:16px;border:1px solid var(--border2);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:10px}
.ingredient-check.checked{background:var(--steel);border-color:var(--steel2);color:var(--white)}
.method-step{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--silver);line-height:1.6}
.method-step:last-child{border-bottom:none}
.method-num{font-size:10px;font-weight:700;color:var(--steel3);flex-shrink:0;width:18px;padding-top:1px}
.swap-btn{width:100%;padding:11px;border-radius:var(--r);border:1px solid var(--steel);background:transparent;color:var(--steel3);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;margin-top:14px;transition:all .2s}
.swap-btn:hover{background:var(--steel);color:var(--white)}
.swap-btn:disabled{opacity:.35;cursor:not-allowed}

/* Week header in output */
.week-hd{background:linear-gradient(135deg,var(--steel),var(--steel2));border-radius:var(--r);padding:11px 16px;margin:18px 0 9px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--white);box-shadow:0 3px 15px rgba(58,95,150,.25)}
.day-block{border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px;overflow:hidden;transition:border-color .2s}
.day-block:hover{border-color:var(--border2)}
.day-hd{padding:9px 13px;background:var(--card2);display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--silver)}
.day-body{padding:11px 13px}
.meal-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.meal-row:last-child{border-bottom:none}
.meal-type{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--steel3)}
.meal-name{font-size:12px;font-weight:500;color:var(--white);margin-top:2px}
.meal-macros{font-size:10px;color:var(--muted);margin-top:2px}
.meal-cals{font-size:12px;font-weight:700;color:var(--white);flex-shrink:0;margin-left:11px}
.ex-item{padding:5px 0;display:flex;gap:8px;border-bottom:1px solid var(--border);font-size:12px;color:var(--silver)}
.ex-item:last-child{border-bottom:none}
.ex-arr{color:var(--steel3);font-weight:700;flex-shrink:0}
.plan-title{font-size:13px;font-weight:600;color:var(--white);margin:1.25rem 0 .75rem;letter-spacing:.02em}

/* Progress ring wrap */
.progress-ring-wrap{display:flex;align-items:center;gap:14px;margin-bottom:18px}

/* Responsive */
@media(max-width:500px){
  .row2,.stat-grid,.ov-grid{grid-template-columns:1fr 1fr}
  .row3,.goal-grid,.diet-grid{grid-template-columns:1fr 1fr 1fr}
  .dur-grid{grid-template-columns:1fr 1fr}
  .plan-type-grid{grid-template-columns:1fr 1fr}
  .ring-row{grid-template-columns:1fr 1fr 1fr}
  .chart-grid{grid-template-columns:1fr}
  .photo-grid{grid-template-columns:repeat(2,1fr)}
  .cardio-form{grid-template-columns:1fr}
  .meas-wrap{grid-template-columns:1fr 1fr}
}

/* ── MORNING CHECK-IN ───────────────────────────── */
.morning-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.morning-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--gold),var(--gold2));opacity:.5}
.morning-metric{margin-bottom:14px}
.morning-metric:last-child{margin-bottom:0}
.morning-metric-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.morning-metric-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--silver)}
.morning-metric-val{font-size:12px;font-weight:700}
.metric-scale{display:flex;gap:5px}
.metric-btn{flex:1;padding:8px 4px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;text-align:center}
.metric-btn:hover{border-color:var(--border2);color:var(--white)}
.metric-btn.sel-green{background:rgba(78,204,163,.15);border-color:var(--green);color:var(--green)}
.metric-btn.sel-gold{background:rgba(201,169,110,.12);border-color:var(--gold);color:var(--gold)}
.metric-btn.sel-red{background:rgba(255,107,107,.1);border-color:var(--red);color:var(--red)}
.rhr-input-wrap{display:flex;align-items:center;gap:10px}
.rhr-input{width:80px;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--r);background:rgba(13,21,37,.8);color:var(--white);font-family:inherit;font-size:16px;font-weight:700;outline:none;text-align:center}
.rhr-input:focus{border-color:var(--steel2)}
.rhr-trend{font-size:11px;font-weight:600}
.supp-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.supp-check-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .2s;font-size:11px;color:var(--muted)}
.supp-check-item:hover{border-color:var(--border2);color:var(--white)}
.supp-check-item.done{border-color:rgba(78,204,163,.3);background:rgba(78,204,163,.05);color:var(--green)}
.supp-tick{width:16px;height:16px;border:1.5px solid var(--border2);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .2s}
.supp-check-item.done .supp-tick{background:var(--green);border-color:var(--green);color:#000}

/* ── TRAINING QUALITY ────────────────────────────── */
.session-quality-card{background:var(--card2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin:10px 16px 0}
.sq-title{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel3);margin-bottom:12px}
.sq-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sq-field label{display:block;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.rpe-scale{display:flex;gap:3px}
.rpe-btn{flex:1;padding:7px 2px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center}
.rpe-btn.sel{background:var(--steel);border-color:var(--steel2);color:var(--white)}

/* ── MEAL TIMING ─────────────────────────────────── */
.meal-timing-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.meal-timing-row:last-child{border-bottom:none}
.meal-timing-name{flex:1;color:var(--white);font-weight:500}
.meal-time-input{padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);background:rgba(13,21,37,.8);color:var(--white);font-family:inherit;font-size:12px;outline:none;width:100px;transition:border-color .2s}
.meal-time-input:focus{border-color:var(--steel2)}
.hunger-mini{display:flex;gap:3px}
.hunger-btn{width:24px;height:24px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center}
.hunger-btn.sel{background:var(--steel);border-color:var(--steel2);color:var(--white)}

/* ── BODY COMPOSITION ────────────────────────────── */
.body-comp-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:18px;margin-bottom:14px}
.body-comp-stat{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px;text-align:center}
.bcs-val{font-family:'Playfair Display',serif;font-size:20px;color:var(--white);margin-bottom:2px}
.bcs-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.bcs-change{font-size:10px;font-weight:600;margin-top:3px}

/* ── COACHING INTELLIGENCE ───────────────────────── */
.insight-card{border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:10px;background:var(--card);position:relative;overflow:hidden;transition:border-color .2s}
.insight-card:hover{border-color:var(--border2)}
.insight-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.insight-card.type-green::before{background:var(--green)}
.insight-card.type-gold::before{background:var(--gold)}
.insight-card.type-red::before{background:var(--red)}
.insight-card.type-purple::before{background:var(--purple2)}
.insight-card.type-steel::before{background:var(--steel2)}
.insight-icon{font-size:20px;margin-bottom:8px}
.insight-title{font-size:13px;font-weight:600;color:var(--white);margin-bottom:5px}
.insight-body{font-size:12px;color:var(--silver);line-height:1.7}
.insight-action{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--steel3);margin-top:10px;cursor:pointer}
.coach-review-card{background:linear-gradient(145deg,rgba(15,26,46,.98),rgba(10,17,32,.96));border:1px solid var(--border2);border-radius:var(--rl);padding:18px;margin:0 0 16px;position:relative;overflow:hidden}
.coach-review-card::after{content:'';position:absolute;right:-80px;top:-90px;width:210px;height:210px;border-radius:50%;border:1px solid rgba(126,152,188,.12);pointer-events:none}
.coach-review-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;position:relative;z-index:1}
.coach-review-kicker{font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--steel3);margin-bottom:4px}
.coach-review-title{font-size:17px;font-weight:800;color:var(--white);line-height:1.25}
.coach-readiness{width:74px;height:74px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;background:rgba(13,21,37,.85);border:1px solid var(--border);box-shadow:inset 0 0 0 6px rgba(58,95,150,.12)}
.coach-readiness-val{font-size:20px;font-weight:800;color:var(--white);line-height:1}
.coach-readiness-lbl{font-size:8px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.coach-review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;position:relative;z-index:1}
.coach-review-stat{background:rgba(13,21,37,.72);border:1px solid var(--border);border-radius:var(--r);padding:10px}
.coach-review-stat-val{font-size:15px;font-weight:800;color:var(--white);margin-bottom:2px}
.coach-review-stat-lbl{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.35}
.coach-action-list{display:grid;gap:8px;position:relative;z-index:1}
.coach-action{display:flex;gap:10px;align-items:flex-start;background:rgba(5,8,15,.34);border:1px solid var(--border);border-radius:var(--r);padding:11px}
.coach-action-dot{width:9px;height:9px;border-radius:50%;background:var(--steel2);margin-top:5px;flex-shrink:0}
.coach-action.high .coach-action-dot{background:var(--green)}
.coach-action.medium .coach-action-dot{background:var(--gold)}
.coach-action.low .coach-action-dot{background:var(--steel3)}
.coach-action-title{font-size:12px;font-weight:800;color:var(--white);margin-bottom:3px}
.coach-action-body{font-size:11px;color:var(--silver);line-height:1.55}
.coach-review-foot{margin-top:12px;font-size:10px;color:var(--muted);line-height:1.6;position:relative;z-index:1}
.coach-adjust-card{margin-top:12px;background:rgba(58,95,150,.1);border:1px solid var(--border2);border-radius:var(--r);padding:12px;position:relative;z-index:1}
.coach-adjust-title{font-size:12px;font-weight:800;color:var(--white);margin-bottom:4px}
.coach-adjust-body{font-size:11px;color:var(--silver);line-height:1.55;margin-bottom:10px}
.coach-adjust-actions{display:flex;gap:8px;flex-wrap:wrap}
.coach-adjust-btn{flex:1;min-width:130px;padding:9px 12px;border-radius:var(--r);border:1px solid var(--steel2);background:linear-gradient(135deg,var(--steel),var(--steel2));color:var(--white);font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.coach-adjust-reset{background:transparent;border-color:var(--border);color:var(--steel3)}
.target-offset-pill{display:inline-flex;align-items:center;gap:5px;margin-left:7px;padding:3px 8px;border-radius:100px;background:rgba(78,204,163,.1);border:1px solid rgba(78,204,163,.22);color:var(--green);font-size:9px;font-weight:800;letter-spacing:.04em;vertical-align:middle}

/* ── STREAK ──────────────────────────────────────── */
.streak-card{background:linear-gradient(135deg,var(--card2),var(--card3));border:1px solid var(--border2);border-radius:var(--rl);padding:20px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
.streak-card::before{content:'';position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:160px;height:160px;background:radial-gradient(circle,rgba(201,169,110,.12),transparent);border-radius:50%}
.streak-num{font-family:'Playfair Display',serif;font-size:56px;font-weight:600;color:var(--gold);line-height:1;margin-bottom:4px;position:relative}
.streak-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--silver);margin-bottom:4px}
.streak-sub{font-size:11px;color:var(--muted)}

/* ── ALCOHOL ─────────────────────────────────────── */
.alcohol-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:14px}
.unit-grid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.unit-glass{width:36px;height:48px;border:1.5px solid var(--border);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;position:relative}
.unit-glass.active{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08)}
.unit-glass:hover{border-color:var(--border2)}

/* ── MONTHLY REPORT ──────────────────────────────── */
.report-card{background:linear-gradient(135deg,var(--steel),var(--steel2));border-radius:var(--rl);padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.report-card::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border:1px solid rgba(255,255,255,.1);border-radius:50%}
.report-title{font-size:16px;font-weight:600;color:var(--white);margin-bottom:5px}
.report-sub{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:16px;line-height:1.5}
.report-btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:var(--r);border:none;background:rgba(255,255,255,.15);color:var(--white);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all .2s;backdrop-filter:blur(4px)}
.report-btn:hover{background:rgba(255,255,255,.25)}

/* ── PRICING ─────────────────────────────────────── */
.dur-price{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:var(--white);margin:6px 0 2px;line-height:1}
.dur-card.sel .dur-price{color:var(--white)}
.dur-per{font-size:11px;color:var(--silver);font-weight:600;margin-bottom:4px}
.dur-saving{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.02em}
.dur-card.sel .dur-saving{color:var(--green)}
.price-callout{background:rgba(58,95,150,.06);border:1px solid var(--border);border-radius:var(--rl);padding:16px 20px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.price-callout-left{flex:1}
.price-callout-plan{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--steel3);margin-bottom:4px}
.price-callout-name{font-size:16px;font-weight:600;color:var(--white);margin-bottom:2px}
.price-callout-tag{font-size:11px;color:var(--muted)}
.price-callout-right{text-align:right;flex-shrink:0}
.price-callout-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:600;color:var(--white);line-height:1}
.price-callout-compare{font-size:10px;color:var(--muted);margin-top:3px}
.price-callout-compare s{color:var(--muted)}
.price-tag-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.price-include{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.price-include-dot{width:4px;height:4px;border-radius:50%;background:var(--green);flex-shrink:0}
.price-specialist-note{font-size:10px;color:var(--steel3);background:rgba(58,95,150,.1);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;margin-bottom:16px;display:flex;align-items:center;gap:7px}
.value-compare{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:14px 18px;margin-bottom:24px}
.vc-title{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.vc-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.vc-row:last-child{border-bottom:none}
.vc-label{color:var(--silver)}
.vc-price{font-weight:600}
.vc-row.ours .vc-label{color:var(--white);font-weight:600}
.vc-row.ours .vc-price{color:var(--green);font-size:14px}

/* ── SUBSCRIPTION PAGE ───────────────────────────── */
.sub-page{min-height:100vh;background:var(--bg);position:relative;overflow:hidden}
.sub-hero{max-width:900px;margin:0 auto;padding:26px 20px 16px;text-align:left;position:relative;z-index:1}
.sub-hero-panel{background:linear-gradient(145deg,var(--card),rgba(10,17,32,.96));border:1px solid var(--border);border-radius:var(--rl);padding:20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.sub-hero-eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--steel3);margin-bottom:7px}
.sub-hero-title{font-size:24px;font-weight:800;color:var(--white);line-height:1.2;margin-bottom:8px;letter-spacing:0}
.sub-hero-title em{color:var(--white);font-style:normal}
.sub-hero-sub{font-size:13px;color:var(--silver);line-height:1.65;max-width:560px;margin:0}
.sub-toggle{display:flex;background:rgba(13,21,37,.75);border:1px solid var(--border);border-radius:var(--r);padding:4px;gap:4px;width:fit-content;margin:0}
.sub-toggle-btn{padding:9px 24px;border-radius:100px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;transition:all .2s}
.sub-toggle-btn.active{background:var(--steel);color:var(--white);box-shadow:0 2px 12px rgba(58,95,150,.28)}
.sub-toggle-btn:not(.active){background:transparent;color:var(--muted)}
.sub-toggle-save{font-size:11px;font-weight:700;color:var(--green);background:rgba(78,204,163,.1);border:1px solid rgba(78,204,163,.2);padding:3px 10px;border-radius:100px;margin-left:8px;vertical-align:middle}
.plans-wrap{max-width:900px;margin:0 auto;padding:0 20px 60px;position:relative;z-index:1}
.plans-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px}
.plan-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:18px;position:relative;overflow:hidden;transition:border-color .2s}
.plan-card:hover{border-color:var(--border2)}
.plan-card.featured{background:linear-gradient(160deg,var(--card2),var(--card3));border-color:var(--steel2);box-shadow:0 8px 28px rgba(58,95,150,.14)}
.plan-card.featured::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--steel),var(--steel3))}
.plan-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:100px;margin-bottom:16px}
.plan-badge-free{background:rgba(255,255,255,.08);color:var(--silver)}
.plan-badge-pop{background:linear-gradient(to right,var(--steel),var(--steel2));color:var(--white)}
.plan-badge-elite{background:rgba(201,169,110,.15);color:var(--gold);border:1px solid rgba(201,169,110,.2)}
.plan-name{font-size:17px;font-weight:800;color:var(--white);margin-bottom:6px}
.plan-price-wrap{margin:12px 0 14px}
.plan-price{font-family:'Montserrat',sans-serif;font-size:34px;font-weight:800;color:var(--white);line-height:1;letter-spacing:0}
.plan-price-period{font-size:13px;color:var(--muted);margin-top:4px}
.plan-price-annual{font-size:12px;color:var(--green);font-weight:600;margin-top:4px}
.plan-desc{font-size:12px;color:var(--silver);line-height:1.6;margin-bottom:14px}
.plan-features{list-style:none;margin-bottom:18px;display:flex;flex-direction:column;gap:7px}
.plan-feature{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--silver)}
.plan-feature-tick{color:var(--green);font-weight:700;flex-shrink:0;margin-top:1px}
.plan-feature-cross{color:var(--muted);flex-shrink:0;margin-top:1px}
